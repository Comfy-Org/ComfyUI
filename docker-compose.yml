
services:
  comfyui:
    # The published image (built and pushed by .github/workflows/docker-publish.yml).
    # `docker compose pull` fetches it; `docker compose build` builds this tree
    # into the same tag instead.
    image: ${COMFYUI_IMAGE:-shivanshtalwar0/comfyui:latest}
    build:
      context: .
      dockerfile: Dockerfile
      target: comfyui
    # VRAM/offload tuning for GPUs with limited VRAM (e.g. MiniMax H3 on a 32 GB
    # card): DynamicVRAM (default on NVIDIA) keeps inactive weights in RAM and
    # streams only active layers to the GPU; --vram-headroom leaves that much
    # VRAM free for other apps. Async weight offloading is OFF by default (set
    # ASYNC_OFFLOAD_STREAMS>0 in .env to enable): its pinned host buffers
    # compete with staged models on RAM-tight boxes.
    #
    # IMPORTANT: MiniMax H3's four checkpoints total ~43 GB (21 GB UNET +
    # 16 GB text encoder + 5.8 GB VAEs), which does not fit in 32 GB of RAM.
    # Measured on an RTX 5090 / 32 GB RAM box, every H3 job peaks at 29-31 GB
    # of host RAM and a 124-frame clip is the longest that survives; anything
    # longer is OOM-killed (exit 137) mid-run, taking the whole server with it.
    # FAST_DISK=1 (the default here) is what buys that margin back: it streams
    # weights straight from the mmap'd safetensors instead of pinning them in
    # host RAM, so the kernel can evict page cache under pressure rather than
    # killing the process. Turn it off only on a box with enough RAM to hold
    # every checkpoint at once. Host swap (see .env.example) helps too.
    #
    # The flags themselves are built by docker/entrypoint.sh from the env below
    # (the same script a RunPod pod runs), so compose needs no `command`.
    ports:
      # Host port -> the container's 8188 (e.g. COMFYUI_HOST_PORT=8282 on the
      # FloStudio rig, which voxmin-backend reaches over WireGuard).
      - "${COMFYUI_HOST_PORT:-8188}:8188"
    volumes:
      # Model weights live outside the image. Default ./models; point at a
      # shared project dir to reuse one model store between projects, e.g.
      #   MODELS_DIR=~/VoxMin/ace-step/models   (in .env)
      # (use a dedicated model dir, not the huggingface cache dir).
      - ${MODELS_DIR:-./models}:/opt/ComfyUI/models
      - ./input:/opt/ComfyUI/input
      - ./output:/opt/ComfyUI/output
      - ./temp:/opt/ComfyUI/temp
      - ./user:/opt/ComfyUI/user
      - ./api_server/workflows:/opt/ComfyUI/api_server/workflows
      - ~/VoxMin/ace-step/huggingface:/root/.cache/huggingface
      - ./.triton:/root/.triton
    environment:
      - DO_NOT_TRACK=1
      - HF_HUB_DISABLE_TELEMETRY=1
      # VRAM tuning for the comfyui command above (defaults: 2 GB headroom,
      # async offload OFF — pinned host buffers compete with staged weights
      # on RAM-tight boxes).
      - VRAM_HEADROOM_GB=${VRAM_HEADROOM_GB:-2}
      - ASYNC_OFFLOAD_STREAMS=${ASYNC_OFFLOAD_STREAMS:-0}
      - CACHE_RAM_GB=${CACHE_RAM_GB:-2 8}
      - FAST_DISK=${FAST_DISK:-1}
      # 1 = fetch a workflow's checkpoints on first use (--auto-download-models).
      - AUTO_DOWNLOAD_MODELS=${AUTO_DOWNLOAD_MODELS:-1}
      # Extra ComfyUI flags appended by the entrypoint.
      - COMFYUI_ARGS=${COMFYUI_ARGS:-}
      # Hard caps on MiniMax H3 jobs, enforced by the wrapper API before a job
      # is queued: over-budget requests get a 400 instead of OOM-killing the
      # server. Frame count bites hardest (the video VAE tiles spatially but
      # not temporally); canvas*frames is the secondary limit. The defaults are
      # the largest values measured to complete on 32 GB of RAM.
      - COMFY_MINIMAX_H3_MAX_FRAMES=${MINIMAX_H3_MAX_FRAMES:-124}
      - COMFY_MINIMAX_H3_MAX_PIXEL_FRAMES=${MINIMAX_H3_MAX_PIXEL_FRAMES:-91422720}
      # Xiaomi MiMo, used by the H3 endpoints to rewrite a plain-language
      # 'prompt' into a real H3 prompt. Unset only disables the rewrite:
      # 'raw_prompt' still works and needs no key. See .env.example.
      - MIMO_API_KEY=${MIMO_API_KEY:-}
      - MIMO_BASE_URL=${MIMO_BASE_URL:-https://api.xiaomimimo.com/v1}
      - MIMO_MODEL=${MIMO_MODEL:-auto}
      - MIMO_THINKING=${MIMO_THINKING:-disabled}
      # HF_TOKEN is passed through from the host env or a .env file (required
      # for gated models, e.g. the FLUX.2 klein 9B fp8 checkpoint).
      - HF_TOKEN=${HF_TOKEN:-}
      # Require 'Authorization: Bearer <token>' on every route: wrapper API and
      # native /prompt, /queue, /view, /ws (which also takes ?token=), frontend.
      # Unset/empty = open, as before. Set it in .env, one random token per
      # public box (see README 'Authentication'). The healthcheck below sends it.
      - WRAPPER_AUTH_TOKEN=${WRAPPER_AUTH_TOKEN:-}
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; t = os.environ.get('WRAPPER_AUTH_TOKEN'); urllib.request.urlopen(urllib.request.Request('http://localhost:8188/system_stats', headers={'Authorization': 'Bearer ' + t} if t else {}))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  developer-api:
    image: ${COMFYUI_IMAGE:-shivanshtalwar0/comfyui:latest}
    depends_on:
      comfyui:
        condition: service_healthy
    command: uvicorn api_server.developer_api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./api_server/workflows:/opt/ComfyUI/api_server/workflows
    environment:
      - COMFYUI_BASE_URL=http://comfyui:8188
      - COMFYUI_WORKFLOW_DIR=/opt/ComfyUI/api_server/workflows
      - COMFYUI_API_TIMEOUT_SECONDS=900
      - COMFYUI_API_POLL_INTERVAL_SECONDS=1.0
    restart: unless-stopped
