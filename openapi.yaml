                    type: string
                latest_version:
                    type: integer
                version:
                    type: integer
            required:
                - id
                - version
                - latest_version
                - created_by
                - created_at
            type: object
    securitySchemes:
        ApiKeyAuth:
            description: |
                API key authentication. Keys are prefixed with 'comfyui-' and can be
                generated from user account settings. Example: 'comfyui-abc123...'
            in: header
            name: X-API-Key
            type: apiKey
        BearerAuth:
            bearerFormat: JWT
            description: |
                A token in the `Authorization: Bearer` header: a Firebase ID token, a
                Cloud JWT from `POST /api/auth/token`, or an access token that
                `POST /oauth/token` minted for a resource served here. A `comfyui-` key sent
                here counts as `ApiKeyAuth`.
            scheme: bearer
            type: http
        CookieAuth:
            description: |
                Session cookie authentication. Set automatically after successful
                login via the /api/auth/session endpoint.

                A POST, PUT, PATCH or DELETE with it is refused with 403 before the
                handler runs unless the browser labels it same-origin, its `Origin`
                is on the trusted-origins list, or, with no `Sec-Fetch-Site`, its
                `Origin` is this host's own: `cross_site_request` for a cross-site
                label, `origin_not_allowed` otherwise. The OAuth consent POST takes
                it only with an `Origin` that is this host's own, never a trusted
                one. This is not behind `web_session_enabled`.
            in: cookie
            name: session
            type: apiKey
        WebSessionAuth:
            description: |
                Server-side web session, set by `POST /api/auth/session`. The media
                routes, the short-link redirect, OAuth consent, the custom-node proxy
                and the admins' asynqmon UI accept it whatever `web_session_enabled`
                says. The user-facing API groups accept it too, for users with the
                flag on; machine, admin API and service-token routes never do. A credential in a header always wins and never falls back to
                the cookie.

                Wherever the cookie is accepted, the request is checked before the
                handler runs (403 with the `code` shown):
                - `cross_site_request`: the browser labels it `Sec-Fetch-Site:
                  cross-site`, other than a top-level GET navigation to the short-link
                  redirect or OAuth consent.
                - `origin_not_allowed`: an `Origin` that is not on the trusted-origins
                  list, unless the call is labelled same-origin; a POST, PUT, PATCH or
                  DELETE with no `Origin`; or, on API routes, a request without
                  `X-Comfy-Client`, which SDK clients send with their name and version.
                  The OAuth consent POST takes the session only from this host's own
                  origin, so a trusted `Origin` is refused there too.
                - `csrf_invalid`: a POST, PUT, PATCH or DELETE without the session's
                  CSRF token in `X-CSRF-Token`, except on OAuth consent, which checks
                  its own token, and the asynqmon UI, which cannot send one and is
                  not checked for it today.

                With the flag on, `X-Comfy-Workspace-ID` (or `?workspace_id=` where a
                header cannot go) selects the workspace; absent means the personal
                workspace. A malformed or conflicting id is 400 `workspace_id_invalid`.
                An unknown or deleted workspace, or one the user is not a member of, is
                403 `workspace_access_denied`. An account with no personal workspace
                (one SSO created) that is no longer a member of any live workspace,
                for example after its directory removed its last membership, is 403
                `no_workspace_access` on every route that reads the session. All
                three are answered on routes that also
                serve anonymous callers; there, the other refusals fall back to an
                anonymous request, except on the OAuth consent POST, which answers
                `origin_not_allowed` and `cross_site_request` too. Today the
                short-link redirect and the OAuth consent GET, which a link may
                open, do not select a workspace for the session.

                A token or API key whose workspace selector names another workspace
                than the one it resolves to is 400 `workspace_id_invalid` on these
                routes, while the flag is on for its user. A service token, which has
                no workspace, ignores the selector.
            in: cookie
            name: __Host-comfy_session
            type: apiKey
info:
    description: |
        API for ComfyUI - A powerful and modular UI for Stable Diffusion.

        This API allows you to interact with ComfyUI programmatically, including:
        - Retrieving prompt information
        - Retrieving node information
    license:
        name: GNU General Public License v3.0
        url: https://github.com/Comfy-Org/ComfyUI/blob/master/LICENSE
    title: ComfyUI API
    version: 1.0.0
openapi: 3.0.3
paths:
    /api/assets:
        get:
            description: |
                Retrieves a paginated list of assets belonging to the authenticated user.
                Supports filtering by tags, name, metadata, and sorting options.
            operationId: listAssets
            parameters:
                - deprecated: true
                  description: |
                    Deprecated alias for `tags_all`, kept permanently for existing
                    callers. Filter assets that have ALL of these tags. Combining it
                    with `tags_all`, or exceeding 100 tags (counted after removing
                    empty values and duplicates), returns 400 `INVALID_TAG_FILTER`.
                  explode: false
                  in: query
                  name: include_tags
                  schema:
                    items:
                        type: string
                    type: array
                  style: form
                - deprecated: true
                  description: |
                    Deprecated alias for `tags_none`, kept permanently for existing
                    callers. Exclude assets that have ANY of these tags. Combining it
                    with `tags_none`, or exceeding 100 tags (counted after removing
                    empty values and duplicates), returns 400 `INVALID_TAG_FILTER`.
                  explode: false
                  in: query
                  name: exclude_tags
                  schema:
                    items:
                        type: string
                    type: array
                  style: form
                - description: |
                    Filter assets that have ALL of these tags. Tag values are opaque
                    byte-strings compared exactly and case-sensitively; unknown tags
                    are not an error — they simply match nothing. Replaces the
                    deprecated `include_tags`. Sending both spellings, listing the
                    same tag here and in `tags_none`, or exceeding 100 tags per list
                    (counted after removing empty values and duplicates) returns 400
                    `INVALID_TAG_FILTER`.
                  explode: false
                  in: query
                  name: tags_all
                  schema:
                    items:
                        type: string
                    type: array
                  style: form
                - description: |
                    Filter assets that have AT LEAST ONE of these tags. Combines with
                    `tags_all`/`tags_none` by intersection (`tags_none` always wins;
                    overlap with `tags_none` is allowed and leaves a dead term).
                    Supplying a positive tag filter (`tags_any`, `tags_all`, or
                    `include_tags`) replaces the default category filter that is
                    otherwise applied. Lists over 100 tags (counted after removing
                    empty values and duplicates) return 400 `INVALID_TAG_FILTER`.
                  explode: false
                  in: query
                  name: tags_any
                  schema:
                    items:
                        type: string
                    type: array
                  style: form
                - description: |
                    Exclude assets that have ANY of these tags. Replaces the
                    deprecated `exclude_tags`. Sending both spellings, or exceeding
                    100 tags per list (counted after removing empty values and
                    duplicates), returns 400 `INVALID_TAG_FILTER`.
                  explode: false
                  in: query
                  name: tags_none
                  schema:
                    items:
                        type: string
                    type: array
                  style: form
                - description: Filter assets where name contains this substring (case-insensitive)
                  in: query
                  name: name_contains
                  schema:
                    type: string
                - description: JSON object for filtering by metadata fields
                  in: query
                  name: metadata_filter
                  schema:
                    type: string
                - description: Maximum number of assets to return (1-500)
                  in: query
                  name: limit
                  schema:
                    default: 20
                    maximum: 500
                    minimum: 1
                    type: integer
                - description: Number of assets to skip for pagination
                  in: query
                  name: offset
                  schema:
                    default: 0
                    minimum: 0
                    type: integer
                - description: Field to sort by
                  in: query
                  name: sort
                  schema:
                    default: created_at
                    enum:
                        - name
                        - created_at
                        - updated_at
                        - size
                        - last_access_time
                    type: string
                - description: Sort order
                  in: query
                  name: order
                  schema:
                    default: desc
                    enum:
                        - asc
                        - desc
                    type: string
                - description: Whether to include public/shared assets in results
                  in: query
                  name: include_public
                  schema:
                    default: true
                    type: boolean
                - description: |
                    Filter assets by content hash, in the canonical `blake3:<hex>`
                    form. Matches regardless of which of this asset store's two
                    internal hash storage formats the matching row was written
                    under (the canonical form used by from-hash-created references,
                    or the raw `<hex>.<ext>`/bare `<hex>` storage key used by direct
                    uploads) — both represent the same content hash.
                  in: query
                  name: hash
                  schema:
                    type: string
                - description: |
                    Opaque cursor for keyset pagination. Pass the `next_cursor` value
                    from the previous response to fetch the next page. When provided,
                    `offset` is ignored. Cursor pagination is only supported with
                    `sort` values `created_at`, `updated_at`, `name`, or `size`;
                    requests combining `after` with other sort fields return 400.
                    The cursor must have been minted under the same `sort` value used
                    in the follow-up request.
                  in: query
                  name: after
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListAssetsResponse'
                    description: Success - Assets returned
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Invalid request parameters
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Unauthorized
                "403":
                    $ref: '#/components/responses/SessionForbidden'
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Internal server error
            security:
                - ApiKeyAuth: []
                - BearerAuth: []
                - WebSessionAuth: []
            summary: List user assets
            tags:
                - file
        post:
            description: |
                Creates a new asset from a direct file upload (multipart/form-data) with associated metadata.

                If an asset with the same hash already exists, returns the existing asset.
            operationId: createAsset
            requestBody:
                content:
                    multipart/form-data:
                        schema:
                            properties:
                                file:
                                    description: The asset file to upload
                                    format: binary
                                    type: string
                                hash:
                                    description: Content hash of the file.
                                    pattern: ^(blake3|sha256):[a-f0-9]{64}$
                                    type: string
                                id:
                                    description: Optional caller-chosen asset ID. If the upload's content matches an asset you already own in this workspace, that asset is returned and its `id` may differ from the one requested. Otherwise, an ID already taken by any asset is refused with 400 `ASSET_ID_UNAVAILABLE`.
                                    format: uuid
                                    type: string
                                mime_type:
                                    description: MIME type of the asset (e.g., "image/png", "video/mp4")
                                    type: string
                                name:
                                    description: Display name for the asset
                                    type: string
                                preview_id:
                                    description: Optional preview asset ID. Must be your own asset in this workspace; anything else (including a catalog asset, another user's published asset, or an ID that does not exist) is refused with 400 `INVALID_PREVIEW_ID`. If not provided, images use their own ID as preview, except OpenEXR and Radiance HDR, which get no preview; a preview_id equal to the asset's own id is ignored for those.
                                    format: uuid
                                    type: string
                                tags:
                                    description: JSON-encoded array of freeform tag strings, e.g. '["models","checkpoint"]'. Common types include "models", "input", "output", and "temp", but any tag can be used in any order.
                                    type: string
                                user_metadata:
                                    description: Custom JSON metadata as a string
                                    type: string
                            required:
                                - file
                            type: object
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AssetCreated'
                    description: |
                        Asset already existed for this user (deduplicated by content hash); the
                        existing asset is returned with created_new=false.
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AssetCreated'
                    description: Asset created successfully (created_new=true)
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Invalid request (bad file, invalid content type, etc.), `INVALID_PREVIEW_ID` when `preview_id` is not your own asset in this workspace, or `ASSET_ID_UNAVAILABLE` when a caller-chosen `id` is already taken
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Unauthorized
                "403":
                    $ref: '#/components/responses/SessionWriteForbidden'
                "413":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: File too large
                "415":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Unsupported media type
                "422":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Validation error (e.g., disallowed model_type tag)
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Internal server error
            security:
                - ApiKeyAuth: []
                - BearerAuth: []
                - WebSessionAuth: []
            summary: Create a new asset
            tags:
                - file
    /api/assets/{id}:
        delete:
            description: Deletes the asset record.
            operationId: deleteAsset
            parameters:
                - description: Asset ID
                  in: path
                  name: id
                  required: true
                  schema:
                    format: uuid
                    type: string
            responses:
                "204":
                    description: Asset record deleted successfully
                "400":
                    $ref: '#/components/responses/SessionWorkspaceIDInvalid'
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Unauthorized
                "403":
                    $ref: '#/components/responses/SessionWriteForbidden'
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Asset not found
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: 'Asset cannot be deleted because it is referenced by another resource, e.g. a workflow version (error code: ASSET_IN_USE)'
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Internal server error
            security:
                - ApiKeyAuth: []
                - BearerAuth: []
                - WebSessionAuth: []
            summary: Delete asset
            tags:
                - file
        get:
            description: Retrieves detailed information about a specific asset
            operationId: getAssetById
            parameters:
                - description: Asset ID
                  in: path
                  name: id
                  required: true
                  schema:
                    format: uuid
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Asset'
                    description: Asset details retrieved successfully
                "400":
                    $ref: '#/components/responses/SessionWorkspaceIDInvalid'
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Unauthorized
                "403":
                    $ref: '#/components/responses/SessionForbidden'
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Asset not found
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Internal server error
            security:
                - ApiKeyAuth: []
                - BearerAuth: []
                - WebSessionAuth: []
            summary: Get asset details
            tags:
                - file
        put:
            description: |
                Updates an asset's metadata. At least one field must be provided.
                Only name, mime_type, preview_id, and user_metadata can be updated.
                For tag management, use POST (add) and DELETE (remove) /api/assets/{id}/tags.
            operationId: updateAsset
            parameters:
                - description: Asset ID
                  in: path
                  name: id
                  required: true
                  schema:
                    format: uuid
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            minProperties: 1
                            properties:
                                mime_type:
                                    description: Updated MIME type of the asset
                                    type: string
                                name:
                                    description: New display name for the asset
                                    type: string
                                preview_id:
                                    description: Updated preview asset ID. Must be your own asset in this workspace.
                                    format: uuid
                                    type: string
                                user_metadata:
                                    additionalProperties: true
                                    description: Updated custom metadata
                                    type: object
                            type: object
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AssetUpdated'
                    description: Asset updated successfully
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: |
                        Invalid request — no fields provided, or `preview_id` is the zero UUID
                        (`INVALID_PREVIEW_ID`).
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Unauthorized
                "403":
                    $ref: '#/components/responses/SessionWriteForbidden'
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: |
                        Asset not found — returned both when the asset being updated does
                        not exist and when `preview_id` is not your own asset in this
                        workspace (a catalog asset or another user's published asset
                        does not qualify).
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Internal server error
            security:
                - ApiKeyAuth: []
                - BearerAuth: []
                - WebSessionAuth: []
            summary: Update asset metadata
            tags:
                - file
    /api/assets/{id}/content:
        get:
            description: |
                Returns the binary content of an asset by ID.

                The contract is the same across runtimes — "GET this path and you
                receive the asset's bytes" — but the mechanism differs:
                - **Local ComfyUI** streams the bytes directly (`200`,
                  `application/octet-stream`).
                - **Cloud** does not proxy large files; it responds `302` with a
                  `Location` redirect to a short-lived signed storage URL. Clients that
                  follow redirects (browsers, `fetch`/XHR, `<img>`/`<video>`) receive
                  the bytes transparently.

                Prefer this over the filename-addressed `/api/view` when you have an
                asset ID.

                An `<img>`, `<video>` or `<audio>` tag loads this with the
                `WebSessionAuth` or `CookieAuth` cookie, both accepted whatever
                `web_session_enabled` says; neither needs `X-CSRF-Token` or
                `X-Comfy-Client`, which a media tag cannot send. A 403
                AuthTypeNotAllowedError here is a credential the route never takes,
                such as `X-ComfyAPI-Secret`, never the session.
            operationId: getAssetContent
            parameters:
                - description: Asset ID
                  in: path
                  name: id
                  required: true
                  schema:
                    type: string
                - description: |
                    Content-Disposition for the response: `attachment` (download) or
                    `inline` (render in browser). Defaults to `attachment`.
                  in: query
                  name: disposition
                  schema:
                    default: attachment
                    enum:
                        - inline
                        - attachment
                    type: string
                - content:
                    text/plain:
                        schema:
                            type: string
                  description: The workspace a media request reads from, where a media tag cannot send `X-Comfy-Workspace-ID`; see the `MediaWorkspaceID` parameter.
                  in: query
                  name: workspace_id
            responses:
                "200":
                    content:
                        application/octet-stream:
                            schema:
                                format: binary
                                type: string
                    description: Asset content stream (local runtime streams the bytes directly)
                "302":
                    description: Redirect to a signed storage URL (cloud runtime)
                    headers:
                        Cache-Control:
                            description: Private caching directive scoped to the signed URL lifetime
                            schema:
                                type: string
                        Location:
                            description: Short-lived signed URL to the asset content in storage
                            schema:
                                type: string
                        Vary:
                            description: Partitions any cached redirect by auth credentials so a private redirect is not reused across users
                            schema:
                                type: string
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: '`code` `workspace_id_invalid`: the `workspace_id` or `X-Comfy-Workspace-ID` value is malformed, the two disagree, or, with the flag on, a token or API key names another workspace than its own. Or `BAD_REQUEST` from the generated wrapper when a parameter does not bind, such as a repeated `disposition`.'
                "401":
                    $ref: '#/components/responses/SessionUnauthorized'
                "403":
                    $ref: '#/components/responses/SessionForbidden'
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Asset not found
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Internal server error
            security:
                - ApiKeyAuth: []
                - BearerAuth: []
                - CookieAuth: []
                - WebSessionAuth: []
            summary: Get asset content
            tags:
                - file
    /api/assets/{id}/tags:
        delete:
            description: Removes one or more tags from an existing asset
            operationId: removeAssetTags
            parameters:
                - description: Asset ID
                  in: path
                  name: id
                  required: true
                  schema:
                    format: uuid
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                tags:
                                    description: Tags to remove from the asset
                                    items:
                                        type: string
                                    minItems: 1
                                    type: array
                            required:
                                - tags
                            type: object
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TagsModificationResponse'
                    description: Tags removed successfully
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Invalid request
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Unauthorized
                "403":
                    $ref: '#/components/responses/SessionWriteForbidden'
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Asset not found
                "422":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Validation error (e.g., reserved tag)
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Internal server error
            security:
                - ApiKeyAuth: []
                - BearerAuth: []
                - WebSessionAuth: []
            summary: Remove tags from asset
            tags:
                - file
        post:
            description: Adds one or more tags to an existing asset
            operationId: addAssetTags
            parameters:
                - description: Asset ID
                  in: path
                  name: id
                  required: true
                  schema:
                    format: uuid
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                tags:
                                    description: Tags to add to the asset
                                    items:
                                        type: string
                                    minItems: 1
                                    type: array
                            required:
                                - tags
                            type: object
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TagsModificationResponse'
                    description: Tags added successfully
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Invalid request
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Unauthorized
                "403":
                    $ref: '#/components/responses/SessionWriteForbidden'
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Asset not found
                "422":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Validation error (e.g., reserved tag)
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Internal server error
            security:
                - ApiKeyAuth: []
                - BearerAuth: []
                - WebSessionAuth: []
            summary: Add tags to asset
            tags:
                - file
    /api/assets/from-hash:
        post:
            description: |
                Creates a new asset reference using an existing asset's hash.
                This avoids re-uploading the file content when the asset already exists in storage.
                The user can provide their own metadata and tags for the reference.
            operationId: createAssetFromHash
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                hash:
                                    description: 'Blake3 content hash of the existing asset (blake3: prefix)'
                                    pattern: ^blake3:[a-f0-9]{64}$
                                    type: string
                                mime_type:
                                    description: MIME type of the asset (e.g., "image/png", "video/mp4")
                                    type: string
                                name:
                                    description: Display name for the asset reference (optional)
                                    type: string
                                tags:
                                    description: Freeform tags for the asset. Common types include "models", "input", "output", and "temp", but any tag can be used in any order.
                                    items:
                                        type: string
                                    minItems: 1
                                    type: array
                                user_metadata:
                                    additionalProperties: true
                                    description: Custom metadata for this asset reference
                                    type: object
                            required:
                                - hash
                                - tags
                            type: object
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AssetCreated'
                    description: |
                        Asset reference already existed for this user (deduplicated by content
                        hash); the existing asset is returned with created_new=false.
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AssetCreated'
                    description: Asset reference created successfully (created_new=true)
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Invalid request (bad hash format, invalid tags, etc.)
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Unauthorized
                "403":
                    $ref: '#/components/responses/SessionWriteForbidden'
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Source asset with given hash not found
                "422":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Validation error (e.g., disallowed model_type tag)
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Internal server error
            security:
                - ApiKeyAuth: []
                - BearerAuth: []
                - WebSessionAuth: []
            summary: Create asset reference from existing hash
            tags:
                - file
    /api/assets/hash/{hash}:
        head:
            description: |
                Checks if an asset exists in the system by its blake3 hash.
                Returns 200 if the asset exists, 404 if it doesn't.
            operationId: checkAssetByHash
            parameters:
                - description: Blake3 hash of the asset in format 'blake3:hex_digest'
                  in: path
                  name: hash
                  required: true
                  schema:
                    example: blake3:a1b2c3d4e5f67890123456789012345678901234567890123456789012345678
                    pattern: ^blake3:[a-f0-9]{64}$
                    type: string
            responses:
                "200":
                    description: Asset exists
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Invalid hash format
                "401":
                    description: No valid credential (see SessionUnauthorized). No body.
                "403":
                    description: A refused web session request, or the route's own authorization check failing (see SessionForbidden). A HEAD response has no body, so the code is not sent.
                "404":
                    description: Asset not found
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Internal server error
            security:
                - ApiKeyAuth: []
                - BearerAuth: []
                - WebSessionAuth: []
            summary: Check if asset exists by hash
            tags:
                - file
