                    type: string
                session_id:
                    format: uuid
                    type: string
            required:
                - session_id
                - event
            type: object
        RetentionFlowResponse:
            properties:
                experiment_variant:
                    description: |
                        The PostHog arm: control or a retention offer ID. Absent when the
                        subscription is ineligible or the owner is outside the experiment.
                    type: string
                expires_at:
                    description: Unix seconds; reopen cancellation to refresh the offer after expiry.
                    maximum: 9007199254740991
                    type: integer
                    x-go-type: int64
                offer:
                    $ref: '#/components/schemas/RetentionOffer'
                session_id:
                    format: uuid
                    type: string
                subscription:
                    $ref: '#/components/schemas/RetentionFlowSubscription'
            required:
