    /api/assets/tags/refine:
        get:
            description: |
                Returns a histogram of tags appearing on assets matching the given filters.
                Useful for refining asset searches by showing available tags and their counts.
                Only returns tags with non-zero counts (tags that exist on matching assets).
            operationId: getAssetTagHistogram
            parameters:
                - deprecated: true
                  description: |
                    Deprecated alias for `tags_all`, kept permanently for existing
                    callers. Filter assets that have ALL of these tags. The same
                    combination and list-size rules as on `/api/assets` apply
                    (400 `INVALID_TAG_FILTER`).
                  explode: false
                  in: query
                  name: include_tags
                  schema:
                    items:
                        type: string
                    type: array
                  style: form
                - deprecated: true
                  description: |
                    Deprecated alias for `tags_none`, kept permanently for existing
                    callers. Exclude assets that have ANY of these tags. The same
                    combination and list-size rules as on `/api/assets` apply
                    (400 `INVALID_TAG_FILTER`).
                  explode: false
                  in: query
                  name: exclude_tags
                  schema:
                    items:
                        type: string
                    type: array
                  style: form
                - description: |
                    Filter assets that have ALL of these tags. Replaces the deprecated
                    `include_tags`. The same combination and list-size rules as on
                    `/api/assets` apply (400 `INVALID_TAG_FILTER`).
                  explode: false
                  in: query
                  name: tags_all
                  schema:
                    items:
                        type: string
                    type: array
                  style: form
                - description: |
                    Filter assets that have AT LEAST ONE of these tags. Combines with
                    `tags_all`/`tags_none` by intersection (`tags_none` always wins).
                    The same combination and list-size rules as on `/api/assets` apply
                    (400 `INVALID_TAG_FILTER`).
                  explode: false
                  in: query
                  name: tags_any
                  schema:
                    items:
                        type: string
                    type: array
                  style: form
                - description: |
                    Exclude assets that have ANY of these tags. Replaces the deprecated
                    `exclude_tags`. The same combination and list-size rules as on
                    `/api/assets` apply (400 `INVALID_TAG_FILTER`).
                  explode: false
                  in: query
                  name: tags_none
                  schema:
                    items:
                        type: string
                    type: array
                  style: form
                - description: Filter assets where name contains this substring (case-insensitive)
                  in: query
                  name: name_contains
                  schema:
                    type: string
                - description: JSON object for filtering by metadata fields
                  in: query
                  name: metadata_filter
                  schema:
                    type: string
                - description: Maximum number of tags to return (1-1000, default 100)
                  in: query
                  name: limit
                  schema:
                    default: 100
                    maximum: 1000
                    minimum: 1
                    type: integer
                - description: Whether to include public/shared assets in results
                  in: query
                  name: include_public
                  schema:
                    default: true
                    type: boolean
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AssetTagHistogramResponse'
                    description: Success - Tag histogram returned
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Invalid request parameters
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Unauthorized
                "403":
                    $ref: '#/components/responses/SessionForbidden'
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Internal server error
            security:
                - ApiKeyAuth: []
                - BearerAuth: []
                - WebSessionAuth: []
            summary: Get tag histogram for filtered assets
            tags:
                - file
