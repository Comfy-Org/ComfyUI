                    description: Internal server error
            security:
                - ApiKeyAuth: []
                - BearerAuth: []
                - WebSessionAuth: []
            summary: Get task details
            tags:
                - task
    /api/upload/image:
        post:
            description: |
                Upload an image file to cloud storage.

                Image limits:
                  - Maximum file size: 50 MB
                  - Maximum width/height per edge: 16384 px
                  - Maximum total pixel count: 64 megapixels (67108864 pixels)

                Uploads that exceed any of these limits are rejected with HTTP 400.
            operationId: uploadImage
            requestBody:
                content:
                    multipart/form-data:
                        schema:
                            properties:
                                image:
                                    description: The image file to upload
                                    format: binary
                                    type: string
                                overwrite:
                                    description: Whether to overwrite existing file (true/false)
                                    type: string
                                subfolder:
                                    description: Optional subfolder path
                                    type: string
                                type:
                                    description: Upload type (defaults to "output")
                                    type: string
                            required:
                                - image
                            type: object
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    name:
                                        description: Filename of the uploaded image
                                        type: string
                                    subfolder:
                                        description: Subfolder path where image was saved
                                        type: string
                                    type:
                                        description: Type of upload (e.g., "output")
                                        type: string
                                type: object
                    description: Image uploaded successfully
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Bad request
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Unauthorized
                "403":
                    $ref: '#/components/responses/SessionWriteForbidden'
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Internal server error
            security:
                - ApiKeyAuth: []
                - BearerAuth: []
                - WebSessionAuth: []
            summary: Upload an image file
            tags:
                - file
    /api/upload/mask:
        post:
            description: |
                Upload a mask image to be applied to an existing image.

                Image limits apply to both the uploaded mask and the referenced
                original image:
                  - Maximum file size: 50 MB
                  - Maximum width/height per edge: 16384 px
                  - Maximum total pixel count: 64 megapixels (67108864 pixels)

                Uploads that exceed any of these limits are rejected with HTTP 400.
            operationId: uploadMask
            requestBody:
                content:
                    multipart/form-data:
                        schema:
                            properties:
