                        text/plain:
                            schema:
                                type: string
                    description: File already exists and overwrite is set to false.
                "500":
                    content:
                        text/plain:
                            schema:
                                type: string
                    description: General error
            security:
                - ApiKeyAuth: []
                - BearerAuth: []
                - WebSessionAuth: []
            summary: Upload or update a user data file
            tags:
                - user
