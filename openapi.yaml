    /api/interrupt:
        post:
            deprecated: true
            description: |
                Deprecated. Prefer the jobs-namespace cancel endpoints:
                POST /api/jobs/{job_id}/cancel for a single job, or
                POST /api/jobs/cancel to cancel jobs by ID.

                Cancels one job of the authenticated user's. The body is optional, as
                on ComfyUI's own /interrupt, and is never refused: it is read whatever
                its Content-Type (a browser fetch with a string body sends text/plain),
                up to 64 KiB, and never answers 400 or 415.

                When the body is a JSON object whose `prompt_id` is a non-empty string
                (the ComfyUI frontend sends `{"prompt_id": "<job id>"}` naming the job
                it shows running), that job and no other, exactly as
                POST /api/jobs/{job_id}/cancel acts on it: a pending or running job is
                cancelled; one already finished or cancelling is left as it is (200,
                nothing done); an ID that is not one of the
                caller's jobs in this workspace, or is not a job ID (a 36-character
                UUID) at all, returns 404 and cancels nothing.

                In every other case the job is picked by queue order: no body, an
                empty body, `{}`, a `prompt_id` that is absent, null, empty or not a
                string, a body that is not a JSON object (malformed JSON, an array, a
                non-JSON body), or a body longer than 64 KiB. The job, in order:

                1. If a job is running on Cloud: the oldest such job.
                2. Otherwise, if a job that runs on a Build's deployment (the platform
                   gateway) is running: the oldest one.
                3. Otherwise (nothing running) the oldest pending job on Cloud, even
                   when an older pending job runs on a Build's deployment.
                4. Otherwise the oldest pending job that runs on a Build's deployment.

                The job is cancelled; for a job that runs on a Build's deployment, the
                deployment is then asked to stop its run, best effort and after this
                answers: not when the platform cannot be reached, or does not yet know
                the API key the request was made with (the run then continues until it
                ends on its own, and the job still ends cancelled).
            operationId: interruptJob
            responses:
                "200":
                    description: |
                        Success - the job was cancelled, was already finished or
                        cancelling, or (without `prompt_id`) no active job was found
                "400":
                    $ref: '#/components/responses/SessionWorkspaceIDInvalid'
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Unauthorized - Authentication required
                "403":
                    $ref: '#/components/responses/SessionWriteForbidden'
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: |
                        `prompt_id` is not one of the caller's jobs in this workspace, or
                        is not a job ID (a 36-character UUID) at all. Code NOT_FOUND;
                        nothing was cancelled.
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Internal server error
            security:
                - ApiKeyAuth: []
                - BearerAuth: []
                - WebSessionAuth: []
            summary: Interrupt a job, the named one or the first active one
            tags:
                - queue
