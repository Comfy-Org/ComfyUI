                - BearerAuth: []
                - WebSessionAuth: []
            summary: List jobs with pagination and filtering
            tags:
                - workflow
    /api/jobs/{job_id}:
        delete:
            description: |
                Delete a single job and every asset linked to it in one call. The client
                sends a job delete and the backend fans out to the job's assets — the
                client must not enumerate and delete the assets itself.

                The deletion is directional, not symmetric: deleting a job deletes both
                the job and its assets, but deleting an asset directly (via
                `DELETE /api/assets/{id}`) leaves the job and its history record intact.
                Asset visibility is never derived from the job's deletion state.

                The job soft-delete is scoped to user-deletable jobs — the finished,
                failed and cancelled states the Job Queue trash icon acts on (this includes
                still-settling failed and mid-cancellation states, not only strictly
                terminal ones), mirroring the legacy `POST /api/history` delete path this
                endpoint replaces. A pending, in-progress or already-deleted job is left in
                place and returns `204` as a no-op. Idempotent: a job already deleted, or
                an asset already gone, is treated as a successful no-op.

                Asset deletion is a best-effort fan-out of independent hard deletes and is
                NOT atomic: if it aborts partway — a `409` for an in-use asset, or a `500`
                — the assets deleted before the failure stay deleted while the job remains
                in place. A retry re-runs the fan-out and is a no-op for the assets already
                gone.

                If a linked asset cannot be deleted because it is still referenced by
                another resource (e.g. a workflow version), the endpoint surfaces
                `409 ASSET_IN_USE` and leaves the job in place rather than silently
                skipping the asset.
            operationId: deleteJob
            parameters:
                - description: Job identifier (UUID)
                  in: path
                  name: job_id
                  required: true
                  schema:
                    format: uuid
                    type: string
            responses:
                "204":
                    description: Job and its assets deleted successfully, or the job was not in a deletable state (pending/in-progress/already-deleted) and no change was made (no-op)
                "400":
                    $ref: '#/components/responses/SessionWorkspaceIDInvalid'
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Unauthorized - Authentication required
                "403":
                    $ref: '#/components/responses/SessionWriteForbidden'
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Job not found or does not belong to the user
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: 'A linked asset cannot be deleted because it is referenced by another resource, e.g. a workflow version (error code: ASSET_IN_USE); the job is left in place'
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Internal server error
            security:
                - ApiKeyAuth: []
                - BearerAuth: []
                - WebSessionAuth: []
            summary: Delete a job and its assets
            tags:
                - workflow
        get:
            description: |
                Retrieve complete details for a specific job including workflow and outputs.
                Used for detail views, workflow re-execution, and debugging.
            operationId: getJobDetail
            parameters:
                - description: Job identifier (UUID)
                  in: path
                  name: job_id
                  required: true
                  schema:
                    format: uuid
                    type: string
                - description: |
                    When present, each output item in the response receives a `short_url` field containing a short link for that asset. Omit this parameter (the default) to receive a response identical to the no-param baseline. The value selects the link's lifetime and auth model: use `ephemeral_tool_chain` for short-lived (≤5 minute) machine-to-machine handoffs — these are public bearer links where the link ID itself is the credential, so anyone holding the link can resolve it (intended for pasting into an agent/MCP tool chain); use `default` for durable (30 day) human-revisitable links, which are owner-gated and resolvable only by the authenticated owner. Links are always minted under the authenticated request owner's identity; the auth model is selected by the server and is never settable by the caller.
                  in: query
                  name: short_link
                  schema:
                    enum:
                        - ephemeral_tool_chain
                        - default
                    type: string
                  x-runtime:
                    - cloud
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/JobDetailResponse'
                    description: Success - Job details retrieved
                "400":
                    $ref: '#/components/responses/SessionWorkspaceIDInvalid'
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Unauthorized - Authentication required
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Forbidden - Job does not belong to user
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Job not found
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Internal server error
            security:
                - ApiKeyAuth: []
                - BearerAuth: []
                - WebSessionAuth: []
            summary: Get full job details
            tags:
                - workflow
    /api/jobs/{job_id}/assets:
        get:
            description: |
                Retrieve a paginated list of the assets produced by a specific job,
