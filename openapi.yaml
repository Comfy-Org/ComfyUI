components:
    responses:
        SessionForbidden:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ForbiddenError'
            description: A refused request. For a web session, `code` is `workspace_access_denied` (the selected workspace is unknown, deleted, or the user is not a member; the three look the same), `no_workspace_access` (the account has no personal workspace and is a member of no live workspace), `origin_not_allowed` or `cross_site_request`; see the `WebSessionAuth` scheme. For any credential, `sso_required` means an SSO organization holds the account (its email is on the organization's verified domains) and the credential is not an SSO sign-in, or the workspace is an SSO organization's and the account is not on its domains or the credential is not an SSO sign-in; `organization_id`, when present, names the organization to sign in with. `FORBIDDEN` is the route's own authorization check failing, such as an unverified email. A credential this route does not take gets AuthTypeNotAllowedError instead, and so does the session while `web_session_enabled` is off for the user, unless the operation says it takes the session whatever `web_session_enabled` says.
        SessionUnauthorized:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ErrorResponse'
            description: No valid credential, or an `Authorization` header, `X-API-Key` header or `?token=` next to the session cookie that could not be read, which is refused rather than answered with the session. `code` is `UNAUTHORIZED`.
        SessionWorkspaceAccessDenied:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ErrorResponse'
            description: '`code` is `workspace_access_denied`: the selected workspace is unknown, deleted, or the user is not a member; the three look the same. This route also serves anonymous callers, so the session''s other refusals fall back to an anonymous request. See the `WebSessionAuth` scheme.'
        SessionWorkspaceIDInvalid:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ErrorResponse'
            description: '`code` is `workspace_id_invalid`: the `X-Comfy-Workspace-ID` header or `workspace_id` query value is malformed, or conflicts with another value or with the workspace the credential resolves to. Answered only while `web_session_enabled` is on for the user. See the `WebSessionAuth` scheme.'
        SessionWriteForbidden:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ForbiddenError'
            description: A refused request that changes data. For a web session, `code` is `csrf_invalid` (no `X-CSRF-Token`, or not the session's), `workspace_access_denied` (the selected workspace is unknown, deleted, or the user is not a member; the three look the same), `no_workspace_access` (the account has no personal workspace and is a member of no live workspace), `origin_not_allowed` or `cross_site_request`; see the `WebSessionAuth` scheme. For any credential, `sso_required` means an SSO organization holds the account (its email is on the organization's verified domains) and the credential is not an SSO sign-in, or the workspace is an SSO organization's and the account is not on its domains or the credential is not an SSO sign-in; `organization_id`, when present, names the organization to sign in with. `FORBIDDEN` is the route's own authorization check failing, such as an unverified email, or, on `POST /api/workspaces`, an account an SSO organization holds (its organization manages its workspaces; signing in again does not change it). A credential this route does not take gets AuthTypeNotAllowedError instead, and so does the session while `web_session_enabled` is off for the user, unless the operation says it takes the session whatever the flag.
    schemas:
        Asset:
            description: Represents a user-owned asset (image, video, or other generated output).
            properties:
                created_at:
                    description: Timestamp when the asset was created
                    format: date-time
                    type: string
                display_name:
                    description: Display name of the asset. Mirrors name for backwards compatibility.
                    nullable: true
                    type: string
                file_path:
                    description: Relative path in global-namespace-root form (e.g. "models/checkpoints/flux.safetensors")
                    nullable: true
                    type: string
                hash:
                    description: Blake3 hash of the asset content.
                    pattern: ^blake3:[a-f0-9]{64}$
                    type: string
                id:
                    description: Unique identifier for the asset
                    format: uuid
                    type: string
                is_immutable:
                    description: Whether this asset is immutable (cannot be modified or deleted)
                    type: boolean
                job_id:
                    description: ID of the job that created this asset, if available
                    format: uuid
                    nullable: true
                    type: string
                last_access_time:
                    description: Timestamp when the asset was last accessed
                    format: date-time
                    type: string
                loader_path:
                    description: The bare value a loader widget consumes for this asset. For models it is the path inside the category folder (e.g. "flux.safetensors" for "models/checkpoints/flux.safetensors"), which is what the model resolver matches. For input/output/temp it is the content hash, because those assets are fetched by hash rather than staged by name — that is the value LoadImage-style widgets must carry. Clients add the "[output]"/"[temp]" annotation from the asset's own type, so it is never included here. Null when no such value can be derived.
                    nullable: true
                    type: string
                metadata:
                    additionalProperties: true
                    description: System-managed metadata from download sources (HuggingFace, CivitAI, etc.) - read-only, not user-modifiable
                    readOnly: true
                    type: object
                mime_type:
                    description: MIME type of the asset
                    type: string
                name:
                    description: Name of the asset file
                    type: string
                preview_id:
                    description: ID of the preview asset if available
                    format: uuid
                    nullable: true
                    type: string
                preview_url:
                    description: URL for asset preview/thumbnail
                    format: uri
                    type: string
                short_url:
                    description: Durable, owner-gated short link to this asset's content (relative `/api/s/{id}` path). Stable across the underlying signed URL's expiry — resolving it re-mints a fresh signed URL on every request — so it is safe to persist or share into chat, unlike `preview_url`. Only the minting user can resolve it. Omitted when the short-link surface is disabled or the asset has no resolvable content hash.
                    nullable: true
                    type: string
                    x-runtime:
                        - cloud
                size:
                    description: Size of the asset in bytes
                    format: int64
                    type: integer
                tags:
                    description: Tags associated with the asset
                    items:
                        type: string
                    type: array
                updated_at:
                    description: Timestamp when the asset was last updated
                    format: date-time
                    type: string
                user_metadata:
                    additionalProperties: true
                    description: Custom user metadata for the asset
                    type: object
            required:
                - id
                - name
                - created_at
                - updated_at
            type: object
        AssetCreated:
            allOf:
                - $ref: '#/components/schemas/Asset'
                - properties:
                    created_new:
                        description: Whether this was a new asset creation (true) or returned existing (false)
                        type: boolean
                  required:
                    - created_new
                  type: object
            description: Response returned when a new asset is successfully created.
        AssetInfo:
            description: Lightweight asset reference used in workflow publishing payloads.
            properties:
                id:
                    description: Asset identifier.
                    type: string
                in_library:
                    description: Whether the caller already owns this asset.
                    type: boolean
                model:
                    description: Whether this asset is a model.
                    type: boolean
                name:
                    type: string
                preview_url:
                    description: Signed URL for previewing the asset.
                    type: string
                public:
                    description: Whether this is a public (platform-provided) asset.
                    type: boolean
                storage_url:
                    type: string
            required:
                - id
                - name
                - preview_url
                - storage_url
                - model
                - public
                - in_library
            type: object
        AssetTagHistogramResponse:
            description: Histogram of tag counts used for refining asset search results.
            properties:
                tag_counts:
                    additionalProperties:
                        type: integer
                    description: Map of tag names to their occurrence counts on matching assets
                    example:
                        checkpoint: 32
                        lora: 193
                        vae: 6
                    type: object
            required:
                - tag_counts
            type: object
        AssetUpdated:
            description: Response returned when an existing asset is successfully updated.
            properties:
                display_name:
                    description: Display name of the asset. Mirrors name for backwards compatibility.
                    nullable: true
                    type: string
                file_path:
                    description: Relative path in global-namespace-root form (e.g. "models/checkpoints/flux.safetensors")
                    nullable: true
                    type: string
                hash:
                    description: Blake3 hash of the asset content.
                    pattern: ^blake3:[a-f0-9]{64}$
                    type: string
                id:
                    description: Asset ID
                    format: uuid
                    type: string
                job_id:
                    description: ID of the job that created this asset, if available
                    format: uuid
                    nullable: true
                    type: string
                loader_path:
                    description: The bare value a loader widget consumes for this asset. For models it is the path inside the category folder (e.g. "flux.safetensors" for "models/checkpoints/flux.safetensors"), which is what the model resolver matches. For input/output/temp it is the content hash, because those assets are fetched by hash rather than staged by name — that is the value LoadImage-style widgets must carry. Clients add the "[output]"/"[temp]" annotation from the asset's own type, so it is never included here. Null when no such value can be derived.
                    nullable: true
                    type: string
                mime_type:
                    description: Updated MIME type of the asset
                    type: string
                name:
                    description: Updated name of the asset
                    type: string
                tags:
                    description: Tags associated with the asset
                    items:
                        type: string
                    type: array
                updated_at:
                    description: Timestamp of the update
                    format: date-time
                    type: string
                user_metadata:
                    additionalProperties: true
                    description: Updated custom metadata
                    type: object
            required:
                - id
                - updated_at
            type: object
        AuthTypeNotAllowedError:
            description: 403 for a credential the route does not take. `accepted` names the ones it does, as `WWW-Authenticate` does.
            properties:
                accepted:
                    items:
                        type: string
                    type: array
                error:
                    properties:
                        message:
                            type: string
                        type:
                            enum:
                                - auth_type_not_allowed
                            type: string
                    required:
                        - message
                        - type
                    type: object
            required:
                - error
                - accepted
            type: object
        ChurnkeyAuthResponse:
            description: |
                Credentials the Churnkey embed requires to launch the cancel flow.
                `auth_hash` is hex-encoded HMAC-SHA256 of `customer_id` signed with the
                server's CHURNKEY_HMAC_SECRET; it is bound to that single customer ID
                and must not be reused for other customers.
            properties:
                auth_hash:
                    description: Hex-encoded HMAC-SHA256(customer_id, CHURNKEY_HMAC_SECRET)
                    type: string
                customer_id:
                    description: Stripe customer ID for the workspace
                    type: string
                mode:
                    description: Churnkey environment matching the configured app
                    enum:
                        - live
                        - test
                        - sandbox
                    type: string
                offer_subscription_id:
                    description: |
                        Stripe subscription a native Churnkey retention offer may apply to.
                        Present only when the caller is in the native-offer rollout and owns
                        a Personal workspace on an active paid monthly plan with no billing
                        change in flight; absent otherwise, and the client then keeps offers
                        disabled. Present in any mode. Not a signed authorization: the HMAC
                        covers only the customer ID.
                    minLength: 1
                    type: string
            required:
                - customer_id
                - auth_hash
                - mode
            type: object
        CreateWorkflowRequest:
            description: Request body for creating a new saved workflow.
            properties:
                default_view:
                    description: Default view mode
                    enum:
                        - workflow
                        - app
                    type: string
                description:
                    description: Description of the workflow
                    type: string
                forked_from_workflow_id:
                    description: ID of the source workflow if forked
                    type: string
                forked_from_workflow_version_id:
                    description: ID of the source workflow version if forked
                    type: string
                name:
                    description: Display name for the workflow
                    type: string
                workflow_json:
                    additionalProperties: true
                    description: The ComfyUI workflow JSON
                    type: object
            required:
                - workflow_json
            type: object
        CreateWorkflowVersionRequest:
            description: Request body for creating a new version of a saved workflow.
            properties:
                base_version:
                    description: The version number this change is based on (for optimistic concurrency)
                    type: integer
                workflow_json:
                    additionalProperties: true
                    description: The updated ComfyUI workflow JSON
                    type: object
            required:
                - base_version
                - workflow_json
            type: object
        ErrorResponse:
            description: Standard error response with a machine-readable code and human-readable message.
            properties:
                code:
                    type: string
                details:
                    additionalProperties: true
                    description: Optional open object carrying structured, machine-readable context about the error (e.g. offending field names, validation specifics). Absent for most errors; consumers must not assume any particular shape.
                    type: object
                message:
                    type: string
                organization_id:
                    description: 'On `sso_required`: the SSO organization the caller must sign in with (its WorkOS id, `org_...`), the value `GET /api/auth/sso/start?organization=` takes: the organization that owns the account''s email domain, else the workspace''s. Absent when no sign-in would admit the caller (an account another organization holds, in an SSO organization''s workspace), when unknown, and on every other code.'
                    type: string
            required:
                - code
                - message
            type: object
        ExecutionError:
            description: Detailed execution error information from ComfyUI
            properties:
                current_inputs:
                    additionalProperties: true
                    description: Input values at time of failure (empty object if not available)
                    type: object
                current_outputs:
                    additionalProperties: true
                    description: Output values at time of failure (empty object if not available)
                    type: object
                exception_message:
                    description: Human-readable error message
                    type: string
                exception_type:
                    description: Python exception type (e.g., "RuntimeError")
                    type: string
                node_id:
                    description: ID of the node that failed
                    type: string
                node_type:
                    description: Type name of the node (e.g., "KSampler")
                    type: string
                traceback:
                    description: Array of traceback lines (empty array if not available)
                    items:
                        type: string
                    type: array
            required:
                - node_id
                - node_type
                - exception_message
                - exception_type
                - traceback
                - current_inputs
                - current_outputs
            type: object
        FeedbackRequest:
            description: Request to submit user feedback
            properties:
                content:
                    description: The feedback content or message
                    type: string
                metadata:
                    additionalProperties: true
                    description: Additional metadata about the feedback
                    type: object
                rating:
                    description: User's rating of ComfyUI Cloud experience (1-5 stars)
                    maximum: 5
                    minimum: 1
                    type: integer
                type:
                    description: Type of feedback being submitted
                    enum:
                        - missing_nodes
                        - general
                        - missing_models
                    type: string
            required:
                - type
            type: object
        FeedbackResponse:
            description: Response after submitting feedback
            type: object
        ForbiddenError:
            description: 'A 403 body: ErrorResponse, or AuthTypeNotAllowedError for a credential the route does not take.'
            oneOf:
                - $ref: '#/components/schemas/ErrorResponse'
                - $ref: '#/components/schemas/AuthTypeNotAllowedError'
        ForkWorkflowRequest:
            description: Request body for forking an existing workflow into the user's account.
            properties:
                name:
                    description: Name for the forked workflow
                    type: string
                source_version:
                    description: Version number to fork from
                    type: integer
            required:
                - source_version
            type: object
        GetUserDataResponseFull:
            description: List of user data file entries (each with path, size, and modification time) returned when full_info=true.
            items:
                $ref: '#/components/schemas/GetUserDataResponseFullFile'
            type: array
        GetUserDataResponseFullFile:
            description: Individual file entry within a full user data response.
            properties:
                modified:
                    description: UNIX timestamp of the last modification in milliseconds.
                    format: int64
                    type: integer
                path:
                    description: File name or path relative to the user directory.
                    type: string
                size:
                    description: File size in bytes.
                    type: integer
            type: object
        GlobalSubgraphData:
            description: Full data for a global subgraph blueprint
            properties:
                data:
                    description: The full subgraph JSON data as a string
                    type: string
                info:
                    description: Additional information about the subgraph
                    properties:
                        node_pack:
                            description: The node pack/module that provides this subgraph
                            type: string
                    required:
                        - node_pack
                    type: object
                name:
                    description: Display name of the subgraph blueprint
                    type: string
                source:
                    description: Source type of the subgraph - "templates" for workflow templates or "custom_node" for custom node subgraphs
                    type: string
            required:
                - source
                - name
                - info
                - data
            type: object
        GlobalSubgraphInfo:
            description: Metadata for a global subgraph blueprint (without full data)
            properties:
                data:
                    description: The full subgraph JSON data (may be empty in list view)
                    type: string
                info:
                    description: Additional information about the subgraph
                    properties:
                        node_pack:
                            description: The node pack/module that provides this subgraph
                            type: string
                    required:
                        - node_pack
                    type: object
                name:
                    description: Display name of the subgraph blueprint
                    type: string
                source:
                    description: Source type of the subgraph - "templates" for workflow templates or "custom_node" for custom node subgraphs
                    type: string
            required:
                - source
                - name
                - info
            type: object
        HistoryDetailEntry:
            description: History entry with full prompt data. The workflow graph (extra_data.extra_pnginfo) is omitted from records persisted after it stopped being stored; older records may still contain it.
            properties:
                meta:
                    additionalProperties: true
                    description: Metadata about the execution and nodes
                    type: object
                outputs:
                    additionalProperties: true
                    description: Output data from execution (generated images, files, etc.)
                    type: object
                prompt:
                    description: Full prompt execution data
                    properties:
                        extra_data:
                            additionalProperties: true
                            description: Additional execution data. extra_pnginfo (the workflow graph) is omitted from records persisted after it stopped being stored; older records may still contain it.
                            type: object
                        outputs_to_execute:
                            description: Output nodes to execute
                            items:
                                type: string
                            type: array
                        priority:
                            description: Execution priority
                            format: double
                            type: number
                        prompt:
                            additionalProperties: true
                            description: The workflow nodes
                            type: object
                        prompt_id:
                            description: The prompt ID
                            type: string
                    type: object
                status:
                    additionalProperties: true
                    description: Execution status and timeline information
                    type: object
            type: object
        HistoryDetailResponse:
            additionalProperties:
                $ref: '#/components/schemas/HistoryDetailEntry'
            description: |
                Detailed execution history response for a specific prompt.
                Returns a dictionary with prompt_id as key and full history data as value.
            type: object
        HistoryEntry:
            description: History entry with prompt_id and execution data
            properties:
                create_time:
                    description: Job creation timestamp (Unix timestamp in milliseconds)
                    format: int64
                    type: integer
                meta:
                    additionalProperties: true
                    description: Metadata about the execution and nodes
                    type: object
                outputs:
                    additionalProperties: true
                    description: Output data from execution (generated images, files, etc.)
                    type: object
                prompt:
                    description: Filtered prompt execution data (lightweight format)
                    properties:
                        extra_data:
                            additionalProperties: true
                            description: Additional execution data (workflow removed from extra_pnginfo)
                            type: object
                        priority:
                            description: Execution priority
                            format: double
                            type: number
                        prompt_id:
                            description: The prompt ID
                            type: string
                    type: object
                prompt_id:
                    description: Unique identifier for this prompt execution
                    type: string
                status:
                    additionalProperties: true
                    description: Execution status and timeline information
                    type: object
                workflow_id:
                    description: UUID identifying the workflow graph definition
                    type: string
            required:
                - prompt_id
            type: object
        HistoryManageRequest:
            additionalProperties: false
            description: Request to manage history operations
            properties:
                clear:
                    description: If true, clear all history for the authenticated user
                    type: boolean
                delete:
                    description: Array of job IDs to delete from history
                    items:
                        type: string
                    type: array
            type: object
        HistoryResponse:
            description: |
                Execution history response with history array.
                Returns an object with a "history" key containing an array of history entries.
                Each entry includes prompt_id as a property along with execution data.
            properties:
                history:
                    description: Array of history entries ordered by creation time (newest first)
                    items:
                        $ref: '#/components/schemas/HistoryEntry'
                    type: array
            required:
                - history
            type: object
        JobAssetsResponse:
            description: Paginated list of the assets produced by a single job.
            properties:
                assets:
                    description: The job's output assets for the requested page (empty when the job produced none)
                    items:
                        $ref: '#/components/schemas/JobOutputAsset'
                    type: array
                job_id:
                    description: ID of the job these assets belong to
                    format: uuid
                    type: string
                pagination:
                    $ref: '#/components/schemas/PaginationInfo'
            required:
                - job_id
                - assets
                - pagination
            type: object
        JobCancelResponse:
            description: Response for POST /api/jobs/{job_id}/cancel. Returned on both fresh cancels and idempotent no-ops.
            properties:
                cancelled:
                    description: |
                        True when a cancel event was successfully dispatched by this call.
                        False when the job was already in a terminal or cancelling state,
                        in which case the call is a no-op (still 200 — idempotent).
                    type: boolean
            required:
                - cancelled
            type: object
        JobDetailResponse:
            description: Full job details including workflow and outputs
            properties:
                create_time:
                    description: Job creation timestamp (Unix timestamp in milliseconds)
                    format: int64
                    type: integer
                execution_end_time:
                    description: Workflow execution completion timestamp (Unix milliseconds, only present for terminal states)
                    format: int64
                    type: integer
                execution_error:
                    allOf:
                        - $ref: '#/components/schemas/ExecutionError'
                    description: Detailed execution error from ComfyUI (only for failed jobs with structured error data)
                execution_meta:
                    additionalProperties: true
                    description: Node-level execution metadata (only for terminal states)
                    type: object
                execution_start_time:
                    description: Workflow execution start timestamp (Unix milliseconds, only present once execution has started)
                    format: int64
                    type: integer
                execution_status:
                    additionalProperties: true
                    description: ComfyUI execution status and timeline (only for terminal states)
                    type: object
                id:
                    description: Unique job identifier
                    format: uuid
                    type: string
                outputs:
                    additionalProperties: true
                    description: Full outputs object from ComfyUI (only for terminal states)
                    type: object
                outputs_count:
                    description: Total number of output files (omitted for non-terminal states)
                    type: integer
                preview_output:
                    additionalProperties: true
                    description: Primary preview output (only for terminal states)
                    type: object
                previewable_outputs_count:
                    description: Count of outputs classified as previewable media types (images, video, audio, 3D, text) — a subset of outputs_count (omitted for non-terminal states)
                    type: integer
                queue_position:
                    description: |
                        1-based position of this job among the caller's OWN jobs held
                        behind the same concurrency cap (same user, workspace and auth
                        method), in the dispatcher's admission order — i.e. the number of
                        the caller's own capped jobs that will be admitted before this
                        one, plus one. It is NOT a fleet-wide queue position and says
                        nothing about other users' jobs. (For an admin reading someone
                        else's job, the set is that job owner's, not the admin's — the
                        same scoping `workspace_id`/`user_id` already describe.)

                        Null unless `queue_reason` is `concurrency_limit`. May also be
                        null in that state on the rare rows whose admission ordering
                        cannot be determined (no recorded state-change timestamp), or if
                        the count query fails — a missing position never fails the
                        request.
                    minimum: 1
                    nullable: true
                    type: integer
                queue_reason:
                    description: |
                        Why a still-queued job has not started yet. Present only while
                        `status` is `pending`; null for every other status.

                        `status` deliberately folds every waiting state into `pending`
                        (the frontend's filter categories depend on that), so this field
                        is the one that tells the two kinds of waiting apart:

                        - `concurrency_limit` — the job is held behind the caller's OWN
                          per-user/per-auth-method concurrent-job cap. Nothing in the
                          fleet is blocking it; the caller's other running jobs are.
                        - `capacity` — the job is past that cap and admitted, and is now
                          waiting for an inference worker to become free.

                        Detail-only: this field is NOT present on the list view's
                        `JobEntry`, because deriving `queue_position` for a page of jobs
                        would cost one extra query per row.
                    enum:
                        - concurrency_limit
                        - capacity
                    nullable: true
                    type: string
                status:
                    description: User-friendly job status
                    enum:
                        - pending
                        - in_progress
                        - completed
                        - failed
                        - cancelled
                    type: string
                update_time:
                    description: Last update timestamp (Unix timestamp in milliseconds)
                    format: int64
                    type: integer
                user_id:
                    description: |
                        ID of the user that owns this job (see the `workspace_id`
                        description above for why this is always the caller's own id
                        on a successful response).
                    type: string
                workflow:
                    additionalProperties: true
                    description: |
                        Full ComfyUI workflow (10-100KB, omitted if not available).

                        Sensitive credentials are redacted before the response is returned:
                        `extra_data.api_key_comfy_org`, when present, is replaced with the
                        literal string `"[REDACTED]"`. The field is preserved (not removed)
                        so existence checks still pass, but the value is not usable.
                    type: object
                workflow_id:
                    description: UUID identifying the workflow graph definition
                    type: string
                workflow_version_id:
                    description: |
                        UUID of the cloud workflow version this job is pinned to, if the
                        submission carried one (see PromptRequest's workflow_version_id).
                        Absent for jobs submitted without that association, including
                        every job submitted through the public API v2 today.
                    type: string
                workspace_id:
                    description: |
                        ID of the workspace that owns this job. A successful (200)
                        response from this operation is only ever returned for the
                        caller's own job (see this operation's ownership-scoped
                        query), so this is always the caller's own workspace —
                        consumers that also need to correlate this job to its
                        live-progress broadcast channel (workspace+user scoped; see
                        the internal common/gateways/broadcast package) can use this
                        value directly rather than resolving their own identity a
                        second way.
                    type: string
            required:
                - id
                - status
                - create_time
                - update_time
            type: object
        JobEntry:
            description: Lightweight job data for list views (workflow and full outputs excluded)
            properties:
                create_time:
                    description: Job creation timestamp (Unix timestamp in milliseconds)
                    format: int64
                    type: integer
                execution_end_time:
                    description: Workflow execution completion timestamp (Unix milliseconds, only present for terminal states)
                    format: int64
                    type: integer
                execution_error:
                    allOf:
                        - $ref: '#/components/schemas/ExecutionError'
                    description: Detailed execution error from ComfyUI (only for failed jobs with structured error data)
                execution_start_time:
                    description: Workflow execution start timestamp (Unix milliseconds, only present for terminal states)
                    format: int64
                    type: integer
                id:
                    description: Unique job identifier
                    format: uuid
                    type: string
                outputs_count:
                    description: Total number of output files (omitted for non-terminal states)
                    type: integer
                preview_output:
                    additionalProperties: true
                    description: Primary preview output (only present for terminal states)
                    type: object
                previewable_outputs_count:
                    description: Count of outputs classified as previewable media types (images, video, audio, 3D, text) — a subset of outputs_count (omitted for non-terminal states)
                    type: integer
                status:
                    description: User-friendly job status
                    enum:
                        - pending
                        - in_progress
                        - completed
                        - failed
                        - cancelled
                    type: string
                workflow_id:
                    description: UUID identifying the workflow graph definition
                    type: string
            required:
                - id
                - status
                - create_time
            type: object
        JobOutputAsset:
            description: |
                An asset produced by a job, enriched with the per-output node context
                (`node_id`, `output_key`, `output_index`) correlated from the job's
                execution outputs by content hash. The node-context fields are null
                when the asset cannot be matched to an output entry.
            properties:
                created_at:
                    description: Timestamp when the asset was created
                    format: date-time
                    type: string
                hash:
                    description: Blake3 hash of the asset content.
                    pattern: ^blake3:[a-f0-9]{64}$
                    type: string
                id:
                    description: Unique identifier for the asset
                    format: uuid
                    type: string
                mime_type:
                    description: MIME type of the asset
                    type: string
                name:
                    description: Name of the asset file
                    type: string
                node_id:
                    description: ID of the workflow node that produced this asset, if known
                    nullable: true
                    type: string
                output_index:
                    description: Zero-based index of this asset within the node's output slot, if known
                    nullable: true
                    type: integer
                output_key:
                    description: Output slot key under the producing node (e.g. "images"), if known
                    nullable: true
                    type: string
                preview_url:
                    description: Relative URL for asset preview/thumbnail
                    format: uri-reference
                    type: string
                size:
                    description: Size of the asset in bytes
                    format: int64
                    type: integer
            required:
                - id
                - name
                - created_at
            type: object
        JobStatusResponse:
            description: Job status information
            properties:
                assigned_inference:
                    description: The inference instance assigned to this job (if any)
                    nullable: true
                    type: string
                created_at:
                    description: When the job was created
                    format: date-time
                    type: string
                error_message:
                    description: Error message if the job failed
                    nullable: true
                    type: string
                id:
                    description: The job ID
                    format: uuid
                    type: string
                last_state_update:
                    description: When the job status was last changed
                    format: date-time
                    type: string
                status:
                    description: Current job status
                    enum:
                        - waiting_to_dispatch
                        - pending
                        - in_progress
                        - completed
                        - error
                        - cancelled
                    type: string
                updated_at:
                    description: When the job was last updated
                    format: date-time
                    type: string
            required:
                - id
                - status
                - created_at
                - updated_at
            type: object
        JobsCancelRequest:
            additionalProperties: false
            description: Request to cancel multiple jobs by ID.
            properties:
                job_ids:
                    description: Job identifiers (UUIDs) to cancel.
                    items:
                        format: uuid
                        type: string
                    maxItems: 100
                    minItems: 1
                    type: array
            required:
                - job_ids
            type: object
        JobsCancelResponse:
            description: Response for POST /api/jobs/cancel.
            properties:
                cancelled:
                    description: |
                        Job IDs for which a cancel event was successfully dispatched by this
                        call. Jobs already in a terminal or cancelling state are idempotently
                        skipped and will not appear here.
                    items:
                        type: string
                    type: array
            required:
                - cancelled
            type: object
        JobsListResponse:
            description: Paginated list of jobs for the authenticated user.
            properties:
                jobs:
                    description: Array of jobs ordered by specified sort field
                    items:
                        $ref: '#/components/schemas/JobEntry'
                    type: array
                pagination:
                    $ref: '#/components/schemas/PaginationInfo'
            required:
                - jobs
                - pagination
            type: object
        ListAssetsResponse:
            description: Paginated list of assets belonging to the authenticated user.
            properties:
                assets:
                    description: List of assets matching the query
                    items:
                        $ref: '#/components/schemas/Asset'
                    type: array
                has_more:
                    description: Whether more assets are available beyond this page
                    type: boolean
                next_cursor:
                    description: |
                        Opaque cursor to pass as the `after` query parameter to fetch the
                        next page. Omitted from the response when there are no more results.
                    type: string
                total:
                    description: Total number of assets matching the filters
                    type: integer
            required:
                - assets
                - total
                - has_more
            type: object
        ListTagsResponse:
            description: Paginated list of available asset tags.
            properties:
                has_more:
                    description: Whether more tags are available
                    type: boolean
                tags:
                    description: List of tags
                    items:
                        $ref: '#/components/schemas/TagInfo'
                    type: array
                total:
                    description: Total number of tags
                    type: integer
            required:
                - tags
                - total
                - has_more
            type: object
        ModelFile:
            description: Represents a model file with metadata
            properties:
                name:
                    description: The filename of the model
                    example: model.safetensors
                    type: string
                pathIndex:
                    description: Index of the path where this model is located
                    example: 0
                    type: integer
            required:
                - name
                - pathIndex
            type: object
        ModelFolder:
            description: Represents a folder containing models
            properties:
                folders:
                    description: List of paths where models of this type are stored
                    example:
                        - checkpoints
                    items:
                        type: string
                    type: array
                name:
                    description: The name of the model folder
                    example: checkpoints
                    type: string
            required:
                - name
                - folders
            type: object
        NodeInfo:
            description: Metadata describing a single ComfyUI node type and its inputs/outputs.
            properties:
                api_node:
                    description: Whether this is an API node
                    type: boolean
                category:
                    description: Category of the node
                    type: string
                deprecated:
                    description: Whether the node is deprecated
                    type: boolean
                description:
                    description: Description of the node
                    type: string
                display_name:
                    description: Display name of the node
                    type: string
                experimental:
                    description: Whether the node is experimental
                    type: boolean
                input:
                    additionalProperties: true
                    description: Input specifications for the node
                    type: object
                input_order:
                    additionalProperties:
                        items:
                            type: string
                        type: array
                    description: Order of inputs for display
                    type: object
                name:
                    description: Internal name of the node
                    type: string
                output:
                    description: Output types of the node
                    items:
                        type: string
                    type: array
                output_is_list:
                    description: Whether each output is a list
                    items:
                        type: boolean
                    type: array
                output_name:
                    description: Names of the outputs
                    items:
                        type: string
                    type: array
                output_node:
                    description: Whether this is an output node
                    type: boolean
                output_tooltips:
                    description: Tooltips for outputs
                    items:
                        type: string
                    type: array
                python_module:
                    description: Python module implementing the node
                    type: string
            type: object
        PaginationInfo:
            description: |
                Pagination metadata included in list responses. Supports both legacy
                offset/limit pagination and cursor-based pagination. When cursor-based
                pagination is used, `next_cursor` is the primary pagination token and
                `offset`/`total` may be zero.
            properties:
                has_more:
                    description: Whether more items are available beyond this page
                    type: boolean
                limit:
                    description: Items per page
                    minimum: 1
                    type: integer
                next_cursor:
                    description: |
                        Opaque cursor for the next page. Pass this value as the `after`
                        query parameter on the next request. Empty or absent when there
                        are no more results.
                    type: string
                offset:
                    deprecated: true
                    description: 'Current offset (0-based). Deprecated: use cursor-based pagination.'
                    minimum: 0
                    type: integer
                total:
                    description: Total number of items matching filters (may be 0 when using cursor pagination)
                    minimum: 0
                    type: integer
            required:
                - offset
                - limit
                - total
                - has_more
            type: object
        PromptErrorResponse:
            additionalProperties: true
            description: Error response for ComfyUI prompt execution.
            type: object
        PromptInfo:
            description: Metadata about the currently running and queued prompts.
            properties:
                exec_info:
                    properties:
                        queue_remaining:
                            description: Number of items remaining in the queue
                            type: integer
                    type: object
            type: object
        PromptRequest:
            description: Request body for submitting a ComfyUI workflow prompt for execution.
            properties:
                extra_data:
                    additionalProperties: true
                    description: Extra data to be associated with the prompt
                    type: object
                front:
                    description: If true, adds the prompt to the front of the queue
                    type: boolean
                number:
                    description: Priority number for the queue (lower numbers have higher priority)
                    type: number
                partial_execution_targets:
                    description: List of node names to execute
                    items:
                        type: string
                    type: array
                prompt:
                    additionalProperties: true
                    description: The workflow graph to execute
                    type: object
                workflow_id:
                    description: UUID identifying the cloud workflow entity to associate with this job
                    type: string
                workflow_version_id:
                    description: UUID identifying the workflow version to associate with this job
                    type: string
            required:
                - prompt
            type: object
        PromptResponse:
            description: Response returned after successfully queuing a workflow prompt.
            properties:
                node_errors:
                    additionalProperties: true
                    description: Any errors in the nodes of the prompt
                    type: object
                number:
                    description: Priority number in the queue
                    type: number
                prompt_id:
                    description: Unique identifier for the prompt execution
                    format: uuid
                    type: string
            type: object
        PublishWorkflowAssetsRequest:
            description: Request body for publishing workflow assets to the Hub.
            properties:
                asset_ids:
                    description: IDs of assets (inputs and models) to snapshot.
                    items:
                        type: string
                    type: array
            required:
                - asset_ids
            type: object
        PublishedWorkflowDetail:
            description: Full detail of a publicly published workflow on the Hub.
            properties:
                assets:
                    description: Published assets with their library status for the caller.
                    items:
                        $ref: '#/components/schemas/AssetInfo'
                    type: array
                listed:
                    type: boolean
                name:
                    description: Human-readable workflow name.
                    type: string
                publish_time:
                    format: date-time
                    nullable: true
                    type: string
                share_id:
                    type: string
                workflow_id:
                    type: string
                workflow_json:
                    additionalProperties: true
                    description: The workflow JSON content at publish time.
                    type: object
            required:
                - share_id
                - workflow_id
                - name
                - listed
                - workflow_json
                - assets
            type: object
        QueueInfo:
            description: Queue information with pending and running jobs
            properties:
                queue_pending:
                    description: Array of pending job items (ordered by creation time, oldest first)
                    items:
                        description: |
                            Queue item tuple format: [job_number, prompt_id, workflow_json, output_node_ids, metadata]
                            - [0] job_number (integer): Position in queue (1-based)
                            - [1] prompt_id (string): Job UUID
                            - [2] workflow_json (object): Full ComfyUI workflow
                            - [3] output_node_ids (array): Node IDs to return results from
                            - [4] metadata (object): Contains {create_time: <milliseconds>}
                        items: {}
                        maxItems: 5
                        minItems: 5
                        type: array
                    type: array
                queue_running:
                    description: Array of currently running job items
                    items:
                        description: |
                            Queue item tuple format: [job_number, prompt_id, workflow_json, output_node_ids, metadata]
                            - [0] job_number (integer): Position in queue (1-based)
                            - [1] prompt_id (string): Job UUID
                            - [2] workflow_json (object): Full ComfyUI workflow
                            - [3] output_node_ids (array): Node IDs to return results from
                            - [4] metadata (object): Contains {create_time: <milliseconds>}
                        items: {}
                        maxItems: 5
                        minItems: 5
                        type: array
                    type: array
            type: object
        QueueManageRequest:
            additionalProperties: false
            description: Request to manage queue operations
            properties:
                clear:
                    description: If true, clear all pending jobs from the queue
                    type: boolean
                delete:
                    description: Array of job IDs to cancel; pending and running jobs transition to cancelled
                    items:
                        type: string
                    type: array
            type: object
        QueueManageResponse:
            description: Response after a queue management action (delete or clear).
            properties:
                cleared:
                    description: Whether the queue was cleared
