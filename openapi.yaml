                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    name:
                                        description: Filename of the uploaded mask
                                        type: string
                                    subfolder:
                                        description: Subfolder path where mask was saved
                                        type: string
                                    type:
                                        description: Type of upload (e.g., "output")
                                        type: string
                                type: object
                    description: Mask uploaded successfully
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Bad request
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Unauthorized
                "403":
                    $ref: '#/components/responses/SessionWriteForbidden'
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Internal server error
            security:
