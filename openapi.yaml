    /api/vhs/queryvideo:
        get:
            description: |
                VHS custom node endpoint that returns metadata about a video file
                (frame count, fps, resolution, duration). Currently returns default
                placeholder values; real ffprobe integration is a follow-up.

                An `<img>`, `<video>` or `<audio>` tag loads this with the
                `WebSessionAuth` or `CookieAuth` cookie, both accepted whatever
                `web_session_enabled` says; neither needs `X-CSRF-Token` or
                `X-Comfy-Client`, which a media tag cannot send. A 403
                AuthTypeNotAllowedError here is a credential the route never takes,
                such as `X-ComfyAPI-Secret`, never the session.
            operationId: getVhsQueryVideo
            parameters:
                - description: Name of the video file to query
                  in: query
                  name: filename
                  required: true
                  schema:
                    type: string
                - content:
                    text/plain:
                        schema:
                            type: string
                  description: The workspace a media request reads from, where a media tag cannot send `X-Comfy-Workspace-ID`; see the `MediaWorkspaceID` parameter.
                  in: query
                  name: workspace_id
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    source:
                                        description: Source video metadata
                                        properties:
                                            duration:
                                                description: Duration in seconds
                                                type: number
                                            fps:
                                                description: Frames per second
                                                type: number
                                            frames:
                                                description: Total frame count
                                                type: integer
                                            size:
                                                description: '[width, height] in pixels'
                                                items:
                                                    type: integer
                                                maxItems: 2
                                                minItems: 2
                                                type: array
                                        required:
                                            - size
                                            - fps
                                            - frames
                                            - duration
                                        type: object
                                required:
                                    - source
                                type: object
                    description: Video metadata
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: |
                        Missing required query parameter. Produced by the oapi-codegen
                        wrapper via echo.NewHTTPError; the custom Echo HTTPErrorHandler
                        normalizes it to the standard ErrorResponse {code, message} shape
                        (BE-1178). Or `code` `workspace_id_invalid`: the `workspace_id` or
                        `X-Comfy-Workspace-ID` value is malformed, the two disagree, or,
                        with the flag on, a token or API key names another workspace than
                        its own.
                "401":
                    $ref: '#/components/responses/SessionUnauthorized'
                "403":
                    $ref: '#/components/responses/SessionForbidden'
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Internal server error, such as the auth policy failing to look up the workspace `workspace_id` names.
            security:
                - ApiKeyAuth: []
                - BearerAuth: []
                - CookieAuth: []
                - WebSessionAuth: []
            summary: Query VHS video metadata
            tags:
                - file
    /api/view:
        get:
            description: |
                Retrieve and view a file from the ComfyUI file system.
                This endpoint is typically used to view generated images or other output files.

                An `<img>`, `<video>` or `<audio>` tag loads this with the
                `WebSessionAuth` or `CookieAuth` cookie, both accepted whatever
                `web_session_enabled` says; neither needs `X-CSRF-Token` or
                `X-Comfy-Client`, which a media tag cannot send. A 403
                AuthTypeNotAllowedError here is a credential the route never takes,
                such as `X-ComfyAPI-Secret`, never the session.
            operationId: viewFile
            parameters:
                - description: Name of the file to view
                  in: query
                  name: filename
                  required: true
                  schema:
                    example: ComfyUI_00004_.png
                    type: string
                - description: Subfolder path where the file is located
                  in: query
                  name: subfolder
                  schema:
                    example: tests/foo/bar
                    type: string
                - description: Type of file (e.g., output, input, temp)
                  in: query
                  name: type
                  schema:
                    example: output
                    type: string
                - description: Full path to the file (used for temp files)
                  in: query
                  name: fullpath
                  schema:
                    type: string
                - description: Format of the file
                  in: query
                  name: format
                  schema:
                    type: string
                - description: Frame rate for video files
                  in: query
                  name: frame_rate
                  schema:
                    type: integer
                - description: Workflow identifier
                  in: query
                  name: workflow
                  schema:
                    type: string
                - description: Timestamp parameter
                  in: query
                  name: timestamp
                  schema:
                    example: 1234567890
                    type: integer
                - description: |
                    Image channel to extract from PNG images.
                    - 'rgb': Return only RGB channels (alpha set to fully opaque)
                    - 'a' or 'alpha': Return alpha channel as grayscale image
                    - If not specified, return original image unchanged via redirect
                  in: query
                  name: channel
                  schema:
                    example: rgb
                    type: string
                - description: |
                    Maximum dimension (width or height) to resize the image to, preserving aspect ratio.
                    The image is fit within a res x res box. Returns a JPEG thumbnail.
                    Only applies to raster image files (PNG, JPEG, WebP, GIF).
                  in: query
                  name: res
                  schema:
                    example: 256
                    maximum: 1024
                    minimum: 64
                    type: integer
                - content:
                    text/plain:
                        schema:
                            type: string
                  description: The workspace a media request reads from, where a media tag cannot send `X-Comfy-Workspace-ID`; see the `MediaWorkspaceID` parameter.
                  in: query
                  name: workspace_id
            responses:
                "200":
                    content:
                        image/jpeg:
                            schema:
                                description: Resized JPEG thumbnail (returned when res parameter is used)
                                format: binary
                                type: string
                        image/png:
                            schema:
                                description: Processed PNG image with extracted channel
                                format: binary
                                type: string
                    description: Success - File content returned (used when channel or res parameter is present)
                "302":
                    description: Redirect to GCS signed URL
                    headers:
                        Cache-Control:
                            description: Cache directive for the redirect response
                            schema:
                                type: string
                        Location:
                            description: Signed URL to access the file in GCS
                            schema:
                                type: string
                        Vary:
                            description: Headers that affect response caching
                            schema:
                                type: string
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: 'Invalid request parameters, or `code` `workspace_id_invalid`: the `workspace_id` or `X-Comfy-Workspace-ID` value is malformed, the two disagree, or, with the flag on, a token or API key names another workspace than its own.'
                "401":
                    $ref: '#/components/responses/SessionUnauthorized'
                "403":
                    $ref: '#/components/responses/SessionForbidden'
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: File not found or unauthorized
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Internal server error
            security:
                - ApiKeyAuth: []
                - BearerAuth: []
                - CookieAuth: []
                - WebSessionAuth: []
            summary: View a file
            tags:
                - file
    /api/workflow_templates:
        get:
            description: Returns available workflow templates
            operationId: getWorkflowTemplates
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                description: Empty object for workflow templates
                                type: object
                    description: Success
            security: []
            summary: Get available workflow templates
