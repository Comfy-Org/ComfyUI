    /api/extensions:
        get:
            description: |
                Returns the list of custom node web extension JS files available for
                loading by the ComfyUI frontend. Paths are relative to the web root
                (e.g. `/extensions/VHS.core.js`). For a browser that picked a
                developer-platform deployment (the cookie PUT
                /api/workspaces/{id}/deployment sets) the list is the files of the
                Release that deployment runs now, each at a release-scoped path,
                `/extensions/<pack>@<workspace id>@<release id>/<rel>`; otherwise, and
                for anonymous callers, it is the static list.

                The `/extensions/*` files the browser then imports carry no
                Authorization header, and cookie authentication resolves only a
                personal workspace, so the scoped path itself names the workspace and
                the Release. A scoped path is served the Release's file, with
                `Cache-Control: private, max-age=31536000, immutable` and
                `Vary: Sec-Fetch-Site`, to a member of the workspace it names when the
                Release is that workspace's, and is a 404 otherwise. A path with no scope is always the static file, whatever
                the browser picked.
            operationId: getExtensions
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                description: URL paths (relative to web root) of available extension JS files
                                items:
                                    type: string
                                type: array
                    description: JSON array of extension file paths
                "400":
                    $ref: '#/components/responses/SessionWorkspaceIDInvalid'
                "403":
                    $ref: '#/components/responses/SessionWorkspaceAccessDenied'
            security:
                - ApiKeyAuth: []
                - BearerAuth: []
                - WebSessionAuth: []
                - {}
            summary: List custom node JS extensions
            tags:
                - node
    /api/features:
        get:
            description: Returns the server's feature capabilities
            operationId: getFeatures
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                additionalProperties: true
                                properties:
                                    agent-free-use-message-placement:
                                        default: control
                                        description: Authenticated assignment for the Agent free-use notice placement experiment. Current Cloud responses include it and default to control when the caller is unauthenticated, evaluation is unavailable, or no treatment is assigned. It remains optional in the client contract, as agent-starter-prompt-set does, so older environments mid-rolling-deploy and partial feature fixtures fail closed rather than decoding an absent field as the empty string, which is not a member of this enum.
                                        enum:
                                            - control
                                            - top-banner
                                            - near-composer
                                            - above-input
                                            - inside-input
                                        type: string
                                    agent-starter-prompt-set:
                                        default: control
                                        description: Authenticated assignment for the Agent starter-prompt experiment. Current Cloud responses include it and default to control when the caller is unauthenticated, evaluation is unavailable, or no treatment is assigned. It remains optional in the client contract so older environments and partial feature fixtures fail closed. Reading this field does not constitute experiment exposure; the frontend emits the custom exposure event only after rendering the starter prompt surface.
                                        enum:
                                            - control
                                            - test
                                        type: string
                                    billing_web_url:
                                        description: Origin of the billing-web deployment paired with this Cloud environment (e.g. https://billing.comfy.org). Absent when BILLING_WEB_URL is not configured on the server, so a client can tell "not configured" from "configured as empty".
                                        type: string
                                    can_run_partner_nodes:
                                        description: |-
                                            Whether a partner/API-node workflow from THIS authenticated caller could run. It is ingest's own submit-time account-level decision published as a capability, resolved from the same authority ExecutePrompt uses, so a consumer never re-derives it from a tier table.
                                            The two values are NOT symmetric, and a consumer that treats them as symmetric will be wrong.
                                            false is sound: a partner-node submission from this caller would be refused. Usually that refusal is PARTNER_NODE_PAYMENT_REQUIRED, but a caller who is FREE for a further reason (an API key, a non-Google session under FreeTierRequireGoogleSignIn, or no job allowance on the legacy rail) is refused earlier and by a different code. Either way the workflow does not run, which is what the field answers.
                                            true is narrower than it reads: the partner-node paywall is not what refuses this caller. Another gate still might — an inactive subscription, a blocked workspace and a BlockedSubscriptionTiers entry all report true, because their refusal is account-wide rather than about partner nodes, and so do the exemptions and the fail-open outcomes that make ExecutePrompt admit a submission at all (a partner-execution workspace, a disabled subscription check, a failed subscription lookup). Two per-prompt refusals are not modelled here at all, because this field is per-account and they are not: FreeTierBlockedModels (MODEL_PAYMENT_REQUIRED, named open-weights models) and the workspace partner-provider governance gate, which keys on which providers a prompt names and answers 403 for an enforcing workspace or 503 when its policy cannot be verified. A paid caller in a governance-restricted workspace therefore reads true here and is still refused at submit.
                                            So: read false as "do not build with partner nodes" and true as "the partner gate will not stop you". Do not read true as "this caller can submit".
                                            Absent for an unauthenticated caller (the decision is per-identity and there is none) and absent while AgentPartnerCapabilityEnabled is off, which is its default — resolving it costs an account-level authority read that this endpoint does not otherwise make. A consumer must treat absence as "unknown" and fail open, never as false.
                                            Because absence carries that meaning, the field is only ever the authority's answer: unlike the flags beside it, it cannot be set from dynamic configuration, and it is removed from the response rather than left at a configured value when it is unresolvable. It is likewise absent from the WebSocket feature_flags push, which resolves no capability, so a client refreshing from the socket reads "unknown" and fails open rather than inheriting a stale answer.
                                        type: boolean
                                    free_tier_balance:
                                        description: Free-tier job allowance for an authenticated non-paid (FREE-tier) user in the rollout. Absent for paid users and unauthenticated requests. Synthesized from config before a grant row exists so a brand-new user still sees their full allowance.
                                        properties:
                                            allowance:
                                                description: Total free jobs granted for the current period
                                                type: integer
                                            remaining:
                                                description: Free jobs remaining (allowance - used, floored at 0)
                                                type: integer
                                            used:
                                                description: Free jobs consumed so far
                                                type: integer
                                        required:
                                            - allowance
                                            - used
                                            - remaining
                                        type: object
                                    free_tier_offer:
                                        description: The free-tier job allowance offered to new users, so a signed-out visitor sees the real offer before signing up. Same value for authenticated and unauthenticated requests. Absent when the free-tier allowance is disabled or zero.
                                        properties:
                                            job_allowance:
                                                description: Number of free jobs granted to a new FREE-tier user
                                                type: integer
                                            requires_google_sign_in:
                                                description: True when only Google-authenticated sessions receive the allowance; email/password signups get none.
                                                type: boolean
                                        required:
                                            - job_allowance
                                            - requires_google_sign_in
                                        type: object
                                    max_upload_size:
                                        description: Maximum upload size in bytes
                                        type: integer
                                    new_free_tier_subscriptions:
                                        description: Whether new free-tier subscriptions are enabled for this caller. Current servers always emit a boolean; clients should tolerate absence when talking to older servers that predate this declared field.
                                        type: boolean
                                    sso_enabled:
                                        description: Global switch, the same for every caller and readable without credentials. When true, the frontend shows enterprise single sign-on (the SSO sign-in entry and SSO workspace states); when false it shows today's app. It gates no backend behaviour. Defaults to false.
                                        type: boolean
                                    stripe_publishable_key:
                                        description: Stripe publishable key (pk_...) for the environment's Stripe account. Public by design (the secret key is never exposed here). Absent when STRIPE_PUBLISHABLE_KEY is not configured on the server, so a client can tell "not configured" from "configured as empty".
                                        type: string
                                    supports_preview_metadata:
                                        description: Whether the server supports preview metadata
                                        type: boolean
                                    web_session_probe:
