                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Internal server error
            security:
                - ApiKeyAuth: []
                - BearerAuth: []
                - WebSessionAuth: []
            summary: Get information about current prompt execution
            tags:
                - workflow
        post:
            description: |
                Submit a workflow to be executed by the backend.
                The workflow is a JSON object describing the nodes and their connections.
            operationId: executePrompt
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/PromptRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PromptResponse'
                    description: Success - Prompt accepted
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PromptErrorResponse'
                    description: Invalid prompt, or `code` `workspace_id_invalid` (see SessionWorkspaceIDInvalid).
                "401":
                    $ref: '#/components/responses/SessionUnauthorized'
                "402":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PromptErrorResponse'
                    description: 'The account''s plan does not allow this submission; nothing was queued and retrying without changing the plan never succeeds. Disambiguated by the body''s `error.type`, NOT by parsing `error.message`: `PAYMENT_REQUIRED` (no active subscription, no funds, blocked tier), `CLOUD_SUBSCRIPTION_REQUIRED`, `FREE_TIER_EXHAUSTED`, `PARTNER_NODE_PAYMENT_REQUIRED`, or `MODEL_PAYMENT_REQUIRED`.'
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PromptErrorResponse'
                    description: Workspace governance policy blocks one or more partner providers (error.type PARTNER_NODE_DISABLED; error.class_types lists the offending nodes, error.providers the disabled providers), or a refused request with `code` and `message` (see SessionWriteForbidden).
                "413":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PromptErrorResponse'
                    description: Workflow JSON too large
                "429":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PromptErrorResponse'
                    description: 'Retryable backpressure, disambiguated by the body''s `error.type`: `QUEUE_LIMIT` (this workspace''s bounded job queue is full - retrying after some queued jobs complete will succeed) or `FREE_TIER_UNAVAILABLE` (the free tier is switched off for now - retrying once it is back will succeed), or `BILLING_UNAVAILABLE` with `error.reason` `funds_unavailable` (ingest got no billing verdict for the workspace because the billing service was unreachable or rejected the check, or the billing-status read behind a no-funds verdict failed - nothing was queued, and retrying the same submission after `Retry-After` seconds will succeed once billing answers). Of the billing outcomes, a plan or billing policy refusal is a 402; only billing being unavailable is a 429. For a browser that picked a developer-platform deployment, also `PLATFORM_REFUSED` with `error.details` `deployment_not_ready` (the deployment is on its way to ready - nothing was queued, and retrying after `Retry-After` seconds will succeed once it is ready) or another platform 429 passed through.'
                    headers:
                        Retry-After:
                            description: Seconds to wait before retrying. Sent with `BILLING_UNAVAILABLE` and with a `deployment_not_ready` that ingest answers before any job is written.
                            schema:
                                type: integer
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PromptErrorResponse'
                    description: Internal server error
                "503":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PromptErrorResponse'
                    description: Service unavailable
            security:
                - ApiKeyAuth: []
                - BearerAuth: []
                - WebSessionAuth: []
            summary: Submit a workflow for execution
            tags:
                - workflow
