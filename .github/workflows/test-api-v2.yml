name: API v2 Tests

on:
  push:
    branches: [ main, master, release/** ]
  pull_request:
    branches: [ main, master, release/** ]

jobs:
  api-v2:
    name: API v2 (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install requirements
      run: |
        python -m pip install --upgrade pip
        pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
        pip install -r requirements.txt
        pip install -r tests-unit/requirements.txt
    - name: Run API v2 unit tests
      run: |
        python -m pytest tests-unit/api_v2_test tests-unit/prompt_server_test/test_server_extractions.py tests-unit/prompt_server_test/test_cors_headers.py -rA
    - name: Run API v2 execution tests
      run: |
        python -m pytest tests/execution/test_api_v2.py -rA
