name: CI - Cursor Review

# Thin caller for the shared reusable cursor-review workflow in
# Comfy-Org/github-workflows. The review logic (panel matrix, judge
# consolidation, prompts, extract/post/notify scripts) lives there as the
# single source of truth, so this repo only carries the repo-specific diff
# excludes.

on:
  pull_request:
    types: [labeled, unlabeled]

concurrency:
  group: cursor-review-pr-${{ github.event.pull_request.number }}-${{ github.event.label.name }}
  cancel-in-progress: true

jobs:
  cursor-review:
    if: github.event.label.name == 'cursor-review'
    permissions:
      contents: read
      pull-requests: write
    # SHA-pinned per zizmor `unpinned-uses: hash-pin`. Bump this SHA to pick up
    # upstream changes; keep `workflows_ref` matching so prompts/scripts load
    # from the same commit as the workflow definition.
    #
    # This bump crosses the panel's model refresh: three labs instead of four
    # (the Gemini cells were retired upstream after a findings-attribution
    # review), each remaining lane one reasoning notch lower, the Anthropic
    # cell on Opus 5.5, and a panel cell now ends once it has submitted its
    # findings instead of running on to the wall-clock cap. A cell that never
    # reports `status: ok` is still not stopped, so a hung cell fails as
    # before. `diff_excludes` is unchanged and still a supported input.
    uses: Comfy-Org/github-workflows/.github/workflows/cursor-review.yml@06f835f96accfd84d0a0929777d602837402608c # github-workflows main (06f835f)
    with:
      workflows_ref: 06f835f96accfd84d0a0929777d602837402608c
      diff_excludes: >-
        :!**/.claude/**
        :!**/dist/**
        :!**/vendor/**
        :!**/*.generated.*
        :!**/*.min.js
        :!**/*.min.css
    secrets:
      CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
