name: reshape
on:
  push:
    paths:
      - '.github/workflows/reshape-pr.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  reshape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build clean single-commit branch
        run: |
          set -e
          git config user.name "wanfengqi"
          git config user.email "wanfengqi@users.noreply.github.com"
          git checkout -B failure-kind fd7639f477050e5c25b68fc38a9c2a6b6d988211
          git checkout origin/master -- execution.py openapi.yaml comfy_execution/failure_kind.py comfy_execution/graph.py tests-unit/execution_test/test_failure_kind.py
          echo "--- staged ---"
          git status --porcelain
          git commit -m "feat: classify execution failures in a machine-readable way

Execution errors currently carry only node_id / exception_message /
exception_type / traceback / current_inputs. Clients that want to react
to a failure (retry with lower batch size on OOM, bail out on a shape
mismatch) have to pattern-match the human-readable message, and the
service-side tips are appended straight into exception_message.

This adds comfy_execution/failure_kind.py, a single dependency-free
place that classifies an exception into failure_kind (out_of_memory /
shape_mismatch / interrupted / internal) together with a retryable flag
and machine-readable hints, and wires it into execution.py and the
dependency-cycle path in comfy_execution/graph.py. exception_message
keeps only str(ex); the human tips move into hints. openapi.yaml gains
the three optional fields; required is unchanged so existing clients
keep working."
          git log --oneline -3
          git push --force origin failure-kind
