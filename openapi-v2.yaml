# Comfy API v2 — public specification.
#
# GENERATED ONE-WAY — DO NOT HAND-EDIT.
# Projected automatically from the canonical Comfy API v2 contract and
# synced by CI. Change the upstream contract, not this public copy.

openapi: 3.0.3
info:
  title: Comfy API v2
  version: 2.0.0
  description: "The official, versioned HTTP API for running ComfyUI workflows from\nexternal applications: upload inputs, submit a workflow, observe\nexecution, retrieve results.\n\nDesign principles:\n- **Poll-first.** Every capability is reachable via plain GET polling;\n  the SSE stream is a live enhancement, never the source of truth.\n- **Everything is resumable.** Submission is idempotent; job state and\n  outputs are retrievable by ID until `expires_at`.\n- **UUID identity, content-addressed dedup.** Assets are UUID-identified\n  records over blobs keyed by a server-computed blake3 hash. The hash is\n  nullable and may be computed lazily.\n- **Follow links, don't build URLs.** Responses embed follow-up URLs.\n\nAdditive changes only within v2; breaking changes require v3.\n"
servers:
- url: http://127.0.0.1:8189
  description: Self-hosted (comfy-api-proxy)
- url: https://cloud.comfy.org
  description: Comfy Cloud
- url: https://{deployment}.run.comfy.app
  description: Serverless deployment
  variables:
    deployment:
      description: DNS-safe deployment id (subdomain label). Staging uses {deployment}.stg.run.comfy.app.
      default: dep-1234abcd-56ef-7890-abcd-ef1234567890
security:
- bearerAuth: []
- {}
tags:
- name: assets
  description: UUID-identified records over content-addressed blobs.
- name: jobs
  description: One execution of a workflow — durable, pollable, cancelable.
- name: service
  description: Service-level operations.
paths:
  /api/v2/assets:
    post:
      operationId: postAssets
      tags:
      - assets
      summary: Upload an asset (single-call multipart)
      description: 'Single-call `multipart/form-data` upload. The platform streams the

        bytes through its trusted byte-path, dedups by the server-computed

        hash, and mints the asset record.


        The blake3 hash is always computed server-side from the received

        bytes — a client-declared `expected_hash` is verified, never trusted

        (on Comfy Cloud and serverless, only when sent before `file` — see below).

        If location metadata (GPS, XMP, IPTC) is removed from an image before

        it is stored, the asset''s `hash` is the hash of the stored bytes and

        can differ from `expected_hash`. On Comfy Cloud, an upload whose

        bytes open as a JPEG, PNG, WebP or classic TIFF (including TIFF-based

        camera RAW such as DNG, NEF, ARW and CR2, but not BigTIFF) and that

        is over 50 MiB is refused with 422 `validation_error`, whatever its

        `content_type` and whether or not it carries location metadata. A

        request that declares a `Content-Length` over Comfy Cloud''s 200 MB

        (200,000,000-byte) body limit is refused before that check with a

        plain 413 that does not use the `ErrorEnvelope` shape. A body sent

        without a declared length is cut off when it passes that limit, and

        no 413 is sent: a cut-off while the fields before `file` are read

        fails with 422 `invalid_body`, and a cut-off inside the file usually

        fails with 500 `upstream_error`. Nothing after the `file` field is

        read, so a body that only passes the limit there is uploaded

        normally.

        Deployment-scoped surfaces neither strip location metadata nor apply

        the 50 MiB image cap; they limit the request body to 110 MB

        (110,000,000 bytes). A request that declares a `Content-Length` over

        that limit is refused with the same plain 413; a body sent without a

        declared length is cut off when it passes the limit, and the upload

        then fails with an error response that is not guaranteed to be a 413.

        The uploaded asset is referenceable immediately; any content scanning

        runs in the background and does not block the response.


        Send `file` as the last part. Comfy Cloud and serverless deployments

        stream it straight into storage and read the other fields only up to

        it, so a part sent after `file` is never read: a `content_type` or

        `file_path` sent only after it is refused as missing (422); an

        optional field (`expected_hash` or `tags`) is silently ignored — the

        upload succeeds without the hash check or the caller''s tags; on

        serverless deployments, a trailing `expires_in` is likewise ignored,

        losing the retention override; and a second `file` part is dropped,

        so only the first part''s bytes are stored. Comfy Cloud ignores

        `expires_in` wherever it is sent, before or after `file`. The

        response does not say any of these were skipped.


        An upload is a single request. v1 expects files of up to ~100 MB;

        the hard cap is the body limit of the surface it is sent to (above).

        Chunked/resumable large uploads are a deliberate open question.


        Cloud''s hosted API caps every part sent before `file` at 8 KiB,

        including a part it does not recognise (which it otherwise

        ignores), so an extra field over 8 KiB, such as file bytes sent

        under a misspelled name, is refused with 422 `invalid_body`. Parts

        sent after `file` are never read: the 8 KiB cap does not apply to

        them, and a metadata field sent there is treated as absent, so send

        every metadata field before `file`. A declared `Content-Length`

        still counts those bytes toward the size limit above; without one,

        a body that only exceeds the limit there is uploaded normally,

        since nothing after `file` is read.


        On Comfy Cloud an upload fails with 422 `upload_timed_out` when no

        request bytes arrive for 30 seconds, or when the whole request takes

        longer than 10 minutes, however steadily bytes keep arriving.

        On Comfy Cloud an upload can also be refused with 503 `upload_busy`

        and `Retry-After` when the server is busy with other uploads: nothing

        was stored, so the same upload can be sent again after `Retry-After`.

        On a Developer Platform deployment the same 422 `upload_timed_out`

        applies when no request bytes arrive for 30 seconds, or when the whole

        request takes longer than 20 minutes.

        '
      x-streaming-upload: true
      x-idempotency-key: recommended
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              - content_type
              - file_path
              properties:
                content_type:
                  type: string
                  example: image/png
                  description: The asset's media type. On Comfy Cloud it must be valid UTF-8, not blank, at most 255 bytes, must not start or end with whitespace, and must not contain control characters (C0, DEL, C1, U+2028, U+2029) or any invisible format or default-ignorable character (every Unicode general category Cf character, including the zero-width joiners and direction marks, and the other default-ignorable code points); otherwise the request is refused with 422 `invalid_body` before anything is stored. An accepted value is stored as sent. A deployment refuses a `content_type` that is blank, is not valid UTF-8 or contains a control character (C0 other than tab, DEL, C1) or a bidi embedding, override or isolate (U+202A-U+202E, U+2066-U+2069), has a tab outside the whitespace that opens a parameter after a `;`, or whose part before its first `;` is not `type/subtype` (two RFC 9110 tokens, optionally followed by spaces), with 422 `invalid_request` before anything is stored.
                file_path:
                  type: string
                  description: 'Placement path / filename (global-namespace-root form, e.g. `photo.png` or `models/checkpoints/x.safetensors`). On Comfy Cloud the last segment becomes the asset name, so it must be valid UTF-8, at most 255 bytes, must not start with `.`, and must not contain control characters (C0, DEL, C1, U+2028, U+2029) or invisible format and default-ignorable characters (Unicode general category Cf, which includes the bidi embedding, override and isolate controls, soft hyphen, zero-width space, word joiner, BOM and tag characters, plus the other default-ignorable code points such as U+034F, U+2065 and the Hangul fillers); otherwise the request is refused with 422 `invalid_body` before anything is stored. ZWNJ/ZWJ (U+200C, U+200D) are allowed only between two visible non-ASCII characters (so not first, last, next to ASCII or next to another of these invisible characters, though one may follow an allowed variation selector, one right after an Indic virama on a letter of the same script may end a word, and a ZWJ after an Arabic-script letter that joins on both sides, or after that letter''s marks, may precede ASCII such as a ''.'' or end the name), for Persian, Indic and emoji names. The direction marks U+200E, U+200F and U+061C are allowed, for right-to-left names, and so are the visible Arabic number signs (prepended concatenation marks such as U+0600, but not U+070F); the direction marks can still change how a name is displayed. The emoji presentation selectors U+FE0E and U+FE0F are allowed only after an ASCII digit, `#` or `*` that U+20E3 (the keycap) follows, after U+2139, the punctuation emoji U+203C, U+2049, U+3030 and U+303D or the math symbols U+2194, U+25FB-U+25FE, U+2934 and U+2935, and after any other symbol of category So except a regional indicator, a skin-tone modifier, a hair component or U+2800. Other variation selectors are allowed only after a base that can have variants: the Mongolian ones after a Mongolian letter, the rest after a unified Han ideograph, plus U+FE00 after the Myanmar and Phags-pa characters it is registered for. The Mongolian and Han rules follow scripts, not the registered sequence list. The tag characters are allowed only as the tag run of the England, Scotland and Wales flag emoji. These allowed invisible characters, white space, U+2800 and combining marks must not make up the whole segment or come before a leading `.`. A deployment keeps the whole `file_path` as the asset name, so it must be valid UTF-8 and must not contain a control character (C0 U+0000-U+001F, including tab, CR and LF; DEL U+007F; C1 U+0080-U+009F) or a bidi embedding, override or isolate (U+202A-U+202E, U+2066-U+2069); otherwise the request is refused with 422 `invalid_request` before anything is stored. Directory segments and other characters stay allowed there.'
                  example: photo.png
                expected_hash:
                  type: string
                  description: 'Optional client-computed blake3 (`blake3:<hex>`) of the bytes sent. Omit the part to skip verification: on Comfy Cloud and on a deployment a part sent empty is refused with 422 as malformed. Send it before `file`: nothing after the `file` field is read, so a trailing `expected_hash` is neither verified nor refused, and the response does not say the check was skipped. Verified against the server-computed blake3 of the received bytes, not of the stored bytes; mismatch is rejected with 409 `hash_mismatch`. On serverless deployments no asset is minted and no existing asset''s retention is changed; elsewhere the upload is stored before the check, so the 409 returns no asset and a retry with the corrected expectation (and the same file extension) dedups onto it. On Comfy Cloud nothing removes that asset, so when the bytes themselves were wrong they stay stored: as an asset named after the last segment of `file_path` (`x.safetensors` for `models/checkpoints/x.safetensors`), or, when the bytes deduped onto an asset you already had, as that asset under its earlier name. The rest of `file_path` is not recorded. On Comfy Cloud and on a deployment, when `expected_hash` is sent more than once before `file` only the last value is checked, but an empty one among them is still refused with 422.'
                  example: blake3:9f8a1c0d...
                tags:
                  type: array
                  items:
                    type: string
                  description: 'Category tags (e.g. `input`). A create carries at most 64 tags, each a non-empty UTF-8 string of at most 256 bytes (surrounding whitespace included) with no NUL byte. A deployment adds `input` to every asset and counts it, so it takes at most 63 of the caller''s own; the `model_type:` tags derived for a model asset are not counted. A tag set breaking a limit is refused with 422. The rest of this paragraph describes Cloud''s hosted API and a deployment, not the self-hosted proxy. Both cap the bytes of all `tags` parts sent before `file` combined: 8 KiB on Cloud''s hosted API (422 `invalid_body`) and 64 KiB on a deployment (422 `invalid_request`). The cap counts duplicates before they are removed and JSON escapes before they are decoded, and is checked before the count and 256-byte limits above, so a tag set within them can still be refused. A `quoted-printable` part is counted and read after it is decoded; a part in any other `Content-Transfer-Encoding` is read as sent, so a `base64` part is stored as one tag holding its encoded text, while a `7bit`, `8bit` or `binary` part is read like a part with no encoding. A part is read as a JSON array when it starts with `[` (after leading whitespace) and is valid JSON or continues, after optional whitespace, with `"`: `["a","b"]` is two tags, `[]` adds no tags (nor does an empty part), and a malformed array such as `[1]` or `["a` is refused with 422. Any other non-empty part is one bare tag, kept as literal text, so `foo\ud800` sent as a bare part is stored as written. Invalid UTF-8 in a `tags` part, or a lone surrogate escape (e.g. `\ud800`) in a JSON-array `tags` part, is refused with 422 (`invalid_body` on Cloud, `invalid_request` on a deployment).'
                expires_in:
                  type: integer
                  minimum: 60
                  maximum: 604800
                  description: 'Optional retention override in seconds (60s–7d): the asset''s `expires_at` becomes now + `expires_in`, replacing the platform''s default retention. Implementations without configurable retention ignore it. The bounds apply to this override only — the platform default is operator-configured and may lie outside them.'
                  example: 86400
                file:
                  type: string
                  format: binary
                  description: 'The raw bytes. The order of properties in this schema does not set the order of parts on the wire: `file` must be the last part sent (see the field-order rule above).'
      responses:
        '201':
          description: New blob stored; asset minted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
        '200':
          description: Bytes deduped to an existing blob; asset minted over it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: '`hash_mismatch`.'
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '413':
          description: The upload is over the body limit. On Comfy Cloud (200 MB, 200,000,000 bytes) and on deployment-scoped surfaces (110 MB, 110,000,000 bytes) the request declared a `Content-Length` over it; the server's body limit sends this before the upload is handled, so the body is not an `ErrorEnvelope` and its shape is not part of this contract. The self-hosted proxy instead refuses a file over its configured cap (100 MiB by default) with an `ErrorEnvelope` whose code is `payload_too_large`.
        '422':
          description: '`idempotency_key_reuse`, `input_blocked` (the bytes are already stored and flagged by content moderation, so `file_path` is not registered for them), `upload_timed_out` (the client stopped sending or sent too slowly; the server cannot recover the upload, so retry it from a faster connection), or validation failure — including a `tags` set over the limits above or a disallowed tag (`invalid_request` on a deployment or the self-hosted proxy; a deployment answers a body that is not `multipart/form-data` with a boundary with a plain 500 instead). On a deployment that includes a truncated `file` part: the body ends inside the part, before the delimiter that ends it. A body that stops right at that delimiter, without the final `--`, is not rejected: the part reads as complete and is stored. Comfy Cloud''s asset upload answers validation failure instead with `invalid_content_type` (the request is not `multipart/form-data` with a boundary), `invalid_body` (a malformed multipart body or upload field) or `validation_error` (the platform refused the upload, for example an image over the size cap or a disallowed tag). Cloud refuses a malformed multipart body with `invalid_body` when the fault is found before the `file` part. Cloud stops parsing at `file`, so parts after it are never read, and a body that ends inside the streamed file currently gets 500 `upstream_error` instead. The exception is an upload with `expected_hash`: if Cloud accepts the upload before the whole file is read, it reads the rest. A body that ends inside the `file` part, before its delimiter, then gets `invalid_body`, and a complete body gets 500 `upstream_error` instead of 201 or 409; in both cases the asset is already stored, holding only the part of the file read before the upload was accepted. `invalid_body` also covers `tags` parts over the 8 KiB combined cap described under `tags`, and a body sent without a declared length that is cut off at the body limit, as described for this operation. Cloud uses the same code for a missing `file`; a missing `content_type`, or one that breaks the rules under `content_type`; a missing `file_path`, or one that is absolute, starts with `.`, contains `..`, is not already in clean form (no `//`, no `.` segment such as `/./`, and no trailing `/`) or breaks the rules under `file_path`; a `content_type`, `file_path` or `expected_hash` part over 8 KiB; and a non-empty `expected_hash` that is not `blake3:` followed by 64 lowercase hex characters. A `content_type` or `file_path` sent only after `file` counts as missing (see the field-order rule above). Any Content-Type other than `multipart/form-data` with a `boundary` (including a missing or unparseable one) gets `invalid_content_type` on Cloud. On Comfy Cloud and on a deployment, an `expected_hash` part that is present but empty is a malformed field (`invalid_body` on Comfy Cloud, `invalid_request` on a deployment), not an omitted hash.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/DeploymentLookupUnavailable'
        '500':
          $ref: '#/components/responses/UpstreamError'
  /api/v2/assets/from-hash:
    post:
      operationId: assetFromHash
      tags:
      - assets
      summary: Create or reuse an asset over existing bytes
      description: 'Zero-byte fast-path: creates or reuses an asset over a blob the

        platform already has, identified by its blake3 hash.


        On Comfy Cloud, the caller must already own the content in the

        current workspace. Content owned only by another member of that

        workspace does not satisfy the ownership check and returns `404`

        `blob_not_found`, just like an absent hash. A matching caller-owned

        Cloud asset is reused with `200`, `created_new: false` and its UUID,

        name and tags, even when the request supplies a different valid

        `file_path` or `tags`.


        On a deployment, reuse matches both the hash and the exact path in

        the build''s scope. A match returns `200` with `created_new: false`;

        a different path over content the caller may use creates a new

        reference with `201` and `created_new: true`. The self-hosted proxy

        returns its existing hash-indexed record with `200` and

        `created_new: false`, without applying the requested path or tags.


        Reuse keeps the existing name and tags. Cloud and deployment

        validation still applies to submitted metadata before reuse;

        metadata is not exempt from validation because it will not replace

        stored values. Retention may refresh, and content URLs are generated

        for the response, so reuse does not promise an unchanged response.


        Trust boundary: resolves only against blobs the platform itself

        ingested and hashed, and only those the calling account is authorized

        to use — the client hash is a lookup key, never an authority to

        register new content. A miss and "exists but not yours" are

        deliberately indistinguishable (`404` `blob_not_found`).


        The lookup key is the `hash` an upload returned, which is the hash of

        the stored bytes. When location metadata was removed from an image

        before it was stored, that differs from the client''s digest of the

        file it sent, and the client''s digest finds nothing.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - hash
              properties:
                hash:
                  type: string
                  example: blake3:9f8a1c0d...
                file_path:
                  type: string
                  description: 'Placement path / filename for a new reference. Comfy Cloud uses its last segment as the name; a deployment uses the full path. Both default to the bare hash digest when omitted or empty. Cloud reuse keeps the existing name even if a different valid path is supplied; a deployment also matches the path when deciding reuse. The self-hosted proxy keeps its indexed record''s path. On Comfy Cloud a `file_path` that fails path validation, or whose last segment breaks the `file_path` rules of `POST /api/v2/assets`, is answered with 404 `blob_not_found`, the same as an unknown hash. The UTF-8 rule cannot fire here: invalid UTF-8 bytes and lone surrogate escapes (`\ud800`) are replaced with U+FFFD when the JSON body is decoded, so such a name is stored with U+FFFD in their place. A deployment answers a `file_path` that fails path validation or holds a control character (C0, DEL, C1) or a bidi embedding, override or isolate (U+202A-U+202E, U+2066-U+2069) with 422 `invalid_request`; the same U+FFFD replacement applies there.'
                  example: photo.png
                tags:
                  type: array
                  items:
                    type: string
                  description: 'Tags for a new reference; reuse keeps the existing tags. Comfy Cloud defaults an omitted or empty set to `input`. Cloud and deployment validation still applies on reuse; the self-hosted proxy does not apply submitted tags. A create carries at most 64 tags, each a non-empty UTF-8 string of at most 256 bytes (surrounding whitespace included) with no NUL byte. A deployment adds `input` to every asset and counts it, so it takes at most 63 of the caller''s own; the `model_type:` tags derived for a model asset are not counted. A tag set breaking a limit is refused with 422. Invalid UTF-8 or a lone surrogate escape (e.g. `\ud800`) inside a JSON-encoded tag is not refused: JSON decoding replaces it with U+FFFD (3 bytes each), and the 256-byte limit applies to the replaced value.'
                expires_in:
                  type: integer
                  minimum: 60
                  maximum: 604800
                  description: 'Optional retention override in seconds (60s–7d): the asset''s `expires_at` becomes now + `expires_in`, replacing the platform''s default retention. Implementations without configurable retention ignore it. The bounds apply to this override only — the platform default is operator-configured and may lie outside them.'
                  example: 86400
      responses:
        '201':
          description: A new asset reference with a new UUID was created over existing bytes; `created_new` is true. Supplied metadata and defaults apply as described above.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
        '200':
          description: An existing asset was reused under the serving surface's rules above; `created_new` is false. Its UUID, name and tags are kept; retention may refresh and content URLs are generated for this response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: '`blob_not_found` — no blob the caller may mint from.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: 'The `tags` or `expires_in` is malformed, `tags` breaks the limits above or holds a disallowed tag, or (on a deployment) the `file_path` is malformed: `invalid_request` on a deployment. On Cloud a tag with a malformed shape is `invalid_body`, and a refusal by the platform (for example a disallowed tag) is `validation_error`. Cloud answers a malformed `file_path` with 404 `blob_not_found` instead (see `file_path`). A deployment checks the tags even when an identical reference exists.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/DeploymentLookupUnavailable'
        '500':
          $ref: '#/components/responses/UpstreamError'
  /api/v2/assets/from-path:
    post:
      operationId: assetFromPath
      tags:
      - assets
      summary: Register a file already on the serving host (reserved)
      description: 'Reserved for registering a file that already exists on the serving host without uploading it. No surface implements registration yet: self-hosted ComfyUI answers `501` `not_implemented`; Comfy Cloud and serverless deployments do not serve this operation. Success responses will be added, additively, when a surface implements it. Upload with `POST /api/v2/assets` instead.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetFromPathRequest'
      responses:
        '501':
          description: '`not_implemented` — this surface does not register host files.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/UpstreamError'
  /api/v2/assets/by-hash/{hash}:
    head:
      operationId: headAssetByHash
      tags:
      - assets
      summary: Existence check for a blob by blake3 hash
      description: '`200` if the calling account can mint from this blob, `404` otherwise. Same account-scoping as `from-hash`; lets a client decide between the dedup fast-path and a full upload before sending bytes. Use the `hash` an upload returned: for an image whose location metadata was removed before storage, the client''s digest of the file it sent names no stored blob. A refusal answers its status with no body, so a `403`''s code is not readable here.'
      parameters:
      - $ref: '#/components/parameters/BlakeHash'
      responses:
        '200':
          description: Blob present and mintable by the caller.
        '404':
          description: No blob the caller may mint from.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/DeploymentLookupUnavailable'
        '500':
          $ref: '#/components/responses/UpstreamError'
  /api/v2/assets/{id}:
    get:
      operationId: getAsset
      tags:
      - assets
      summary: Asset metadata
      description: Returns the asset object with a fresh short-lived `url` for the content. Re-fetching always yields fresh URLs.
      parameters:
      - $ref: '#/components/parameters/AssetId'
      responses:
        '200':
          description: The asset.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/DeploymentLookupUnavailable'
        '500':
          $ref: '#/components/responses/UpstreamError'
    delete:
      operationId: deleteAsset
      tags:
      - assets
      summary: Delete an asset record
      description: 'Deletes the asset RECORD. The underlying content-addressed blob is

        untouched while any other asset still references it (hash dedup means

        blobs are shared) — deleting an asset never destroys another asset''s

        bytes.


        A second delete of the same id returns `404`, indistinguishable from

        an id that never existed or belongs to another account.

        '
      parameters:
      - $ref: '#/components/parameters/AssetId'
      responses:
        '204':
          description: Record deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`asset_in_use` — the record cannot be deleted while the platform still depends on it. Each surface defines its own holds (for example: a job''s outputs reference the record, or a content-moderation workflow requires it to be preserved); the response body deliberately never says which hold applies.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/DeploymentLookupUnavailable'
        '500':
          $ref: '#/components/responses/UpstreamError'
  /api/v2/assets/{id}/content:
    get:
      operationId: getAssetContent
      tags:
      - assets
      summary: Asset bytes
      description: 'Serves the bytes directly on surfaces where the platform stores blobs

        itself (self-hosted); on Cloud and serverless issues a `302` to a

        fresh signed URL. Range requests are supported for resumable

        downloads of large outputs.

        '
      parameters:
      - $ref: '#/components/parameters/AssetId'
      - name: Range
        in: header
        required: false
        schema:
          type: string
        description: Standard HTTP range, e.g. `bytes=0-1048575`.
      responses:
        '200':
          description: The full content.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '206':
          description: Partial content for a ranged request.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '302':
          description: Redirect to a fresh signed URL (Cloud / serverless).
          headers:
            Location:
              schema:
                type: string
                format: uri
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
